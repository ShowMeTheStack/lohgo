evel":"Beginner","tags":["rectangle","dot","filled","picture","coordinates"],"summary":"Builds a friendly robot from colored blocks, round eyes and an antenna, then waves its arm."},{"path":"shapes/rounded-corners.lgo","cat":"shapes","title":"Rounded Corners","level":"Intermediate","tags":["arcs","polygon","rounded rectangle","filled","buttons"],"summary":"Softens the corners of squares, triangles and rectangles by walking a small curve at every turn."},{"path":"shapes/shape-maker.lgo","cat":"shapes","title":"Shape Maker","level":"Beginner","tags":["input","readlist","polygon","validation"],"summary":"Asks how many sides and how long they are, then draws that polygon in the middle of the screen."},{"path":"shapes/shape-morph.lgo","cat":"shapes","title":"Shape Morph","level":"Advanced","tags":["animation","interpolation","resampling","easing","lists"],"summary":"Smoothly melts a triangle into a square, a star, a heart and a circle, and round again."},{"path":"shapes/simple-house.lgo","cat":"shapes","title":"A House on a Hill","level":"Beginner","tags":["rectangle","triangle","filled","picture"],"summary":"Builds a colored house with a roof, door, windows, chimney and a sun out of simple shapes."},{"path":"shapes/spinning-solids.lgo","cat":"shapes","title":"Spinning Platonic Solids","level":"Advanced","tags":["3d","rotation","projection","animation","arrays","trigonometry"],"summary":"Spins wireframe models of all five Platonic solids in 3D, working out every edge from the corners alone."},{"path":"shapes/star-polygons.lgo","cat":"shapes","title":"Star Polygon Table","level":"Intermediate","tags":["star polygon","gcd","recursion","geometry","angles"],"summary":"Draws the star polygon {n/k} for many n and k, splitting into several shapes when n and k share a factor."},{"path":"shapes/star-shapes.lgo","cat":"shapes","title":"Star Shapes","level":"Beginner","tags":["star","angles","filled","repeat"],"summary":"Draws pointy stars with crossing lines, an outline star with no lines inside, and a filled gold star."},{"path":"shapes/street-of-houses.lgo","cat":"shapes","title":"A Street of Houses","level":"Intermediate","tags":["procedures","random","inputs","filled","picture"],"summary":"Builds a whole street of different houses, each from one HOUSE procedure with random sizes and colors."},{"path":"shapes/tangram.lgo","cat":"shapes","title":"Tangram Square","level":"Intermediate","tags":["tangram","coordinates","lists","centroid","puzzle"],"summary":"Draws the seven tangram pieces fitted into a square, then the same pieces pulled apart."},{"path":"shapes/triangle-family.lgo","cat":"shapes","title":"Triangle Family","level":"Beginner","tags":["triangle","angles","repeat","setxy"],"summary":"Draws an equilateral triangle, a right triangle, a tall thin triangle and a stack of triangles."},{"path":"patterns/cellular-automata.lgo","cat":"patterns","title":"Cellular Automaton Tapestry","level":"Advanced","tags":["cellular automaton","rules","arrays","binary","emergence"],"summary":"Grows four woven-looking patterns row by row from one black cell, each following a different tiny rule."},{"path":"patterns/celtic-plait.lgo","cat":"patterns","title":"Celtic Plait","level":"Advanced","tags":["celtic knot","weaving","over and under","lattice","arc"],"summary":"Weaves ribbons over and under each other on a diagonal grid to draw Celtic plaitwork borders."},{"path":"patterns/checkerboard.lgo","cat":"patterns","title":"Checkerboard","level":"Beginner","tags":["grid","nested loops","filled","even and odd"],"summary":"Paints an 8 by 8 checkerboard with a wooden frame and sets out the red and black pieces."},{"path":"patterns/circle-rosette.lgo","cat":"patterns","title":"Circle Rosette","level":"Beginner","tags":["circle","rotation","rosette","overlapping"],"summary":"Walks circle after circle through the center of the screen, turning between them, to make a rosette."},{"path":"patterns/eight-point-stars.lgo","cat":"patterns","title":"Eight-Point Star Tiles","level":"Intermediate","tags":["tessellation","star","geometric art","grid","filled"],"summary":"Tiles the screen with eight-pointed stars whose tips touch, leaving cross shapes between them, in the style of Islamic geometric art."},{"path":"patterns/flower-bed.lgo","cat":"patterns","title":"Flower Bed","level":"Intermediate","tags":["random","procedures","depth","sorting","picture"],"summary":"Plants a bed of daisies, sunflowers, tulips and poppies at random, with the far ones smaller and drawn first."},{"path":"patterns/flower-maker.lgo","cat":"patterns","title":"Flower Maker","level":"Beginner","tags":["input","readword","petals","arcs","garden"],"summary":"Asks how many petals and which color, then grows that flower in a little garden, one after another."},{"path":"patterns/guilloche.lgo","cat":"patterns","title":"Guilloche Rosette","level":"Advanced","tags":["guilloche","polar coordinates","sine waves","phase","banknote art"],"summary":"Draws the fine woven line rosettes found on banknotes and certificates, from wavy circles shifted a little at a time."},{"path":"patterns/kaleidoscope.lgo","cat":"patterns","title":"Kaleidoscope","level":"Intermediate","tags":["symmetry","reflection","rotation","random walk","animation"],"summary":"A wandering line is copied eight times, turned and mirrored, so it paints an ever-changing kaleidoscope."},{"path":"patterns/layered-mandala.lgo","cat":"patterns","title":"Layered Mandala","level":"Intermediate","tags":["mandala","symmetry","procedures as data","run","filled"],"summary":"Builds a mandala from the inside out, one ring at a time, each ring a different motif repeated round the circle."},{"path":"patterns/mandala-generator.lgo","cat":"patterns","title":"Mandala Generator","level":"Advanced","tags":["random","rerandom","seed","generative art","readlist","run"],"summary":"Turns any name or number you type into its own mandala, and the same name always gives the same mandala."},{"path":"patterns/moire.lgo","cat":"patterns","title":"Moire Magic","level":"Intermediate","tags":["moire","interference","circles","lines","optical illusion"],"summary":"Slides two sets of thin rings across each other so that ghostly bands appear and change where they cross."},{"path":"patterns/patchwork-quilt.lgo","cat":"patterns","title":"Patchwork Quilt","level":"Intermediate","tags":["quilt","tiles","rotation","grid","filled","random"],"summary":"Sews a quilt from three traditional blocks (pinwheel, hourglass and nine-patch) laid out in a grid."},{"path":"patterns/pinwheel.lgo","cat":"patterns","title":"Paper Pinwheel","level":"Beginner","tags":["triangle","rotation","filled","animation"],"summary":"Builds a pinwheel from eight colored triangles and then makes it spin in the wind."},{"path":"patterns/polka-dots.lgo","cat":"patterns","title":"Polka Dot Grid","level":"Beginner","tags":["grid","dot","nested loops","distance"],"summary":"Fills the screen with a grid of dots that grow bigger toward the middle, like a comic book print."},{"path":"patterns/ring-of-shapes.lgo","cat":"patterns","title":"Ring of Shapes","level":"Beginner","tags":["rotation","penup","polygon","circle placement"],"summary":"Places hexagons, triangles and stars evenly round circles to make a ring pattern like a necklace."},{"path":"patterns/spinning-squares.lgo","cat":"patterns","title":"Spinning Squares","level":"Beginner","tags":["repeat","rotation","color","square"],"summary":"Draws one square, turns a little, draws another, until a ring of colored squares makes a flower."},{"path":"patterns/string-art-circle.lgo","cat":"patterns","title":"String Art Circle","level":"Intermediate","tags":["string art","envelope","circle","modular arithmetic","lines"],"summary":"Hammers nails round a circle and winds colored threads from each nail to one further along, layer by layer."},{"path":"patterns/sunburst.lgo","cat":"patterns","title":"Sunburst","level":"Beginner","tags":["lines","rotation","remainder","color"],"summary":"Shoots rays out from the center in three lengths and warm colors to make a bright sunburst."},{"path":"patterns/symmetry-painter.lgo","cat":"patterns","title":"Symmetry Painter","level":"Advanced","tags":["mouse","keyboard","events","symmetry","rotation","reflection"],"summary":"Paint with the mouse and every stroke is repeated round the center with rotation and mirror symmetry."},{"path":"patterns/tessellation-gallery.lgo","cat":"patterns","title":"Tessellation Gallery","level":"Intermediate","tags":["tessellation","tiling","polygons","grid","coordinates"],"summary":"Shows four ways to cover a floor with regular polygons and no gaps: triangles, squares, hexagons, and octagons with squares."},{"path":"patterns/truchet-tiles.lgo","cat":"patterns","title":"Truchet Tiles","level":"Intermediate","tags":["tiles","random","arcs","grid","emergence"],"summary":"Covers the screen with square tiles, each holding two quarter circles turned one of two ways at random."},{"path":"patterns/turtle-stamps.lgo","cat":"patterns","title":"Turtle Stamps","level":"Beginner","tags":["stamp","setshape","rings","rotation"],"summary":"Uses the turtle itself as a rubber stamp to print rings of turtles, stars, arrows and squares."},{"path":"patterns/wallpaper-symmetry.lgo","cat":"patterns","title":"Wallpaper Symmetry","level":"Advanced","tags":["symmetry","transformations","wallpaper groups","lists","apply"],"summary":"Repeats one lopsided little flag four different ways (slide, half turn, mirror, quarter turn) to show how wallpaper patterns are made."},{"path":"spirals/archimedes-spiral.lgo","cat":"spirals","title":"Archimedes' Spiral","level":"Intermediate","tags":["archimedean spiral","polar coordinates","setxy","measurement"],"summary":"Plots the spiral where the distance from the center grows evenly with the angle, and measures its equal gaps."},{"path":"spirals/bezier-curves.lgo","cat":"spirals","title":"Bezier Curves","level":"Advanced","tags":["bezier","de casteljau","interpolation","mouse","recursion","animation"],"summary":"Builds a smooth curve from four control points by repeatedly cutting lines in the same ratio, and lets you drag the points."},{"path":"spirals/bubble-spiral.lgo","cat":"spirals","title":"Bubble Spiral","level":"Beginner","tags":["spiral","arc","circles","color"],"summary":"Blows a string of bubbles that grow bigger as they curl outward along a spiral path."},{"path":"spirals/cardioid-times-table.lgo","cat":"spirals","title":"Cardioid from Lines","level":"Intermediate","tags":["cardioid","times table","envelope","modular arithmetic","animation"],"summary":"Joins point k to point 2k round a circle and a heart-shaped cardioid appears; then the multiplier slowly grows."},{"path":"spirals/curve-stitching.lgo","cat":"spirals","title":"Curve Stitching","level":"Beginner","tags":["string art","parabola","straight lines","for loop"],"summary":"Joins evenly spaced marks on two straight lines to sew a smooth curve out of nothing but straight threads."},{"path":"spirals/epicycles.lgo","cat":"spirals","title":"Epicycles and Square Waves","level":"Advanced","tags":["fourier series","epicycles","circles","waves","animation"],"summary":"Stacks spinning circles on top of each other so the tip of the last one draws a wave that gets closer and closer to a square."},{"path":"spirals/euler-spiral.lgo","cat":"spirals","title":"Euler Spiral and Smooth Roads","level":"Advanced","tags":["clothoid","curvature","euler spiral","engineering","graphs"],"summary":"Draws the Euler spiral, whose bend grows steadily with distance, and shows why road and railway builders use it."},{"path":"spirals/golden-spiral.lgo","cat":"spirals","title":"Golden Spiral","level":"Intermediate","tags":["fibonacci","golden ratio","squares","arc","recursion"],"summary":"Lays Fibonacci-sized squares around each other and joins them with quarter circles to make the golden spiral."},{"path":"spirals/harmonograph.lgo","cat":"spirals","title":"Harmonograph","level":"Advanced","tags":["pendulum","damping","exponential decay","sine","random","art"],"summary":"Imitates a Victorian drawing machine where swinging pendulums move a pen, slowly dying down into a spiral of loops."},{"path":"spirals/inspirals.lgo","cat":"spirals","title":"Inspirals","level":"Intermediate","tags":["inspi","turtle geometry","angles","gcd","closed curves"],"summary":"Keeps the step the same but turns a little MORE each time, which winds the turtle into knots that close up on themselves."},{"path":"spirals/lissajous.lgo","cat":"spirals","title":"Lissajous Figures","level":"Intermediate","tags":["lissajous","sine","parametric curves","animation","oscilloscope"],"summary":"Draws a table of Lissajous figures, the curves made by two sine waves at right angles, and slowly turns them like an oscilloscope."},{"path":"spirals/mice-pursuit.lgo","cat":"spirals","title":"Mice Pursuit","level":"Advanced","tags":["pursuit curve","several turtles","towards","ask","simulation"],"summary":"Puts a turtle on each corner of a polygon, each chasing the next one, and their paths spiral into the middle."},{"path":"spirals/nautilus.lgo","cat":"spirals","title":"Nautilus Shell","level":"Intermediate","tags":["logarithmic spiral","exponential","polar coordinates","filled"],"summary":"Draws a logarithmic spiral and divides it into growing chambers, like the shell of a nautilus."},{"path":"spirals/polyspiral-gallery.lgo","cat":"spirals","title":"Polyspiral Gallery","level":"Beginner","tags":["polyspi","spiral","recursion","angles","rainbow"],"summary":"Draws six polyspirals side by side, the same procedure with six different turning angles."},{"path":"spirals/rolling-wheel.lgo","cat":"spirals","title":"Rolling Wheel Cycloids","level":"Intermediate","tags":["cycloid","trochoid","animation","parametric curves","radians"],"summary":"Rolls a wheel along the ground and traces the curves drawn by a point on its rim, a point inside, and a point outside."},{"path":"spirals/rose-curves.lgo","cat":"spirals","title":"Rose Curves","level":"Intermediate","tags":["rose","polar coordinates","cosine","fractions","petals"],"summary":"Plots the mathematical roses r = cos(k x angle) for eight values of k and shows how k decides the number of petals."},{"path":"spirals/sine-waves.lgo","cat":"spirals","title":"Sine Waves","level":"Beginner","tags":["sine","graph","setxy","waves","axes"],"summary":"Plots a sine wave across the screen, then a faster one and a smaller one, and finally adds two waves together."},{"path":"spirals/snail.lgo","cat":"spirals","title":"Snail Shell","level":"Beginner","tags":["spiral","curve","growing step","picture"],"summary":"Draws a snail whose shell is a smooth spiral made by turning the same amount while the steps keep growing."},{"path":"spirals/spiral-explorer.lgo","cat":"spirals","title":"Spiral Explorer","level":"Beginner","tags":["input","readlist","polyspi","angles","experiment"],"summary":"Asks you for an angle and draws the spiral that angle makes, so you can hunt for beautiful angles."},{"path":"spirals/spirograph.lgo","cat":"spirals","title":"Spirograph","level":"Advanced","tags":["hypotrochoid","gears","gcd","parametric curves","several turtles"],"summary":"Simulates the toy with a toothed wheel rolling inside a ring, drawing layer after layer of looping patterns."},{"path":"spirals/square-spiral.lgo","cat":"spirals","title":"Square Spiral","level":"Beginner","tags":["spiral","repeat","repcount","square"],"summary":"Walks a little further after every right-angle turn, making a square spiral with a color for each direction."},{"path":"spirals/sunflower-seeds.lgo","cat":"spirals","title":"Sunflower Seeds","level":"Intermediate","tags":["phyllotaxis","golden angle","spirals","dot","square root"],"summary":"Places seeds one by one, each turned by the golden angle, and the spirals of a sunflower head appear."},{"path":"spirals/triangle-twist.lgo","cat":"spirals","title":"Triangle Twist","level":"Beginner","tags":["spiral","triangle","angles","color fade"],"summary":"Turns a little more than 120 degrees at each corner so a growing triangle twists into a vortex."},{"path":"spirals/twisting-polygons.lgo","cat":"spirals","title":"Twisting Polygons","level":"Beginner","tags":["polygon","rotation","color","spiral","nested"],"summary":"Draws hexagons that grow and turn a little each time, so their corners trace colored spiral arms."}]};

// ==== ide/tour.js ====
// Guided tours and the step engine that lessons use: spotlight a part of the screen, explain
// it, and (for hands-on steps) wait until the learner has done the thing.
(function (LG) {
  'use strict';
  const { h } = LG.UI;
  const esc = LG.escapeHtml;
  const code = (s) => '<pre>' + esc(s) + '</pre>';

  /** Put text in a program of the learner's own (in /projects/tour) and open it */
  function scratch(app, name, text) {
    const dir = '/projects/tour';
    app.vfs.mkdir(dir, { parents: true, exist: true, trusted: true });
    const p = dir + '/' + name;
    app.vfs.writeText(p, text, { trusted: true });
    const d = app.docByPath(p);
    if (d) { d.editor.setValue(text); d.savedText = text; d.dirty = false; }
    app.openFile(p);
    return p;
  }
  const ed = (app) => app.active && app.active.editor;
  const ranSince = (app, c) => (app.runCount || 0) > c.runs && app.interp.state === 'idle';
  const typed = (app, c, re) => (app.commandLog || []).slice(c.cmds).some((t) => re.test(t));

  const TOURS = {
    welcome: {
      title: 'Welcome to Lohgo',
      steps: [

  const Tours = LG.Tours = {

    start(app, id, opts) {

    stop() {

    next() { const st = Tours.active; if (st && st.i < st.tour.steps.length - 1) { st.i++; Tours.show(st); } },

      }
      const pop = st.pop;
      pop.innerHTML = '';
      const last = st.i === st.tour.steps.length - 1;
      const next = h('button.btn.primary', { type: 'button', id: 'tourNext' }, last ? (st.tour.finishLabel || 'Finish') : 'Next');
      const back = h('button.btn', { type: 'button', id: 'tourBack', disabled: st.i === 0 }, 'Back');
      const close = h('button.btn', { type: 'button', id: 'tourClose' }, 'Close');
      next.addEventListener('click', () => { if (last) { Tours.stop(); if (st.tour.onFinish) st.tour.onFinish(app); } else { st.i++; Tours.show(st); } });
      back.addEventListener('click', () => { if (st.i > 0) { st.i--; Tours.show(st); } });
      close.addEventListener('click', () => Tours.stop());
      const parts = [h('div.step', (st.tour.label || st.tour.title) + ' · ' + (st.i + 1) + ' of ' + st.tour.steps.length), h('h3', step.title)];
      if (step.quiz) {
        const qz = step.quiz;
        const fb = h('p', { style: { fontWeight: '600', margin: '6px 0 0' }, 'aria-live': 'polite' });
        const opts = h('div', { style: { display: 'flex', flexDirection: 'column', gap: '6px', marginTop: '8px' } });
        qz.options.forEach((o, i) => {
          const b = h('button.btn', { type: 'button', style: { textAlign: 'left', height: 'auto', padding: '7px 14px', borderRadius: '12px' } }, h('span', { html: o }));
          b.addEventListener('click', () => {
            const ok = i === qz.answer;
            fb.textContent = (ok ? 'Yes! ' : 'Not quite. ') + (qz.explain || '');
            fb.style.color = ok ? 'var(--accent)' : 'var(--err)';
            if (ok) { next.disabled = false; next.focus(); if (st.tour.onQuiz) st.tour.onQuiz(app, st); }
          });
          opts.appendChild(b);
        });
        parts.push(h('div.txt', { html: qz.q }), opts, fb);
        next.disabled = true;
      } else {
        parts.push(h('div.txt', { html: step.text }));
      }
      let hintEl = null;
      if (step.hint) { hintEl = h('div.txt.muted', { hidden: true, style: { marginTop: '6px' }, html: 'Hint: ' + step.hint }); parts.push(hintEl); }
      let waitEl = null;
      if (step.wait) { waitEl = h('div.wait', step.waitText || 'Waiting for you…'); parts.push(waitEl); }
      const acts = h('div.acts', step.hint ? h('button.btn', { type: 'button', onclick: () => { hintEl.hidden = false; Tours.place(st); } }, 'Hint') : null, close, back, next);
      parts.push(acts);
      pop.append(...parts);
      if (step.wait) {
        next.textContent = last ? 'Finish' : 'Skip';
        st.timer = setInterval(() => {
          let ok = false;
          try { ok = step.wait(app, st.ctx); } catch (e) { ok = false; }
          if (!ok) return;
          clearInterval(st.timer);
          waitEl.textContent = 'Done!';
          waitEl.classList.add('done');
          next.textContent = last ? (st.tour.finishLabel || 'Finish') : 'Next';
          if (st.tour.onStepDone) st.tour.onStepDone(app, st);
          const ae = document.activeElement;
          if (!ae || ae === document.body || pop.contains(ae)) next.focus();
          if (!last) setTimeout(() => { if (Tours.active === st && st.tour.steps[st.i] === step) { st.i++; Tours.show(st); } }, 1100);
        }, 250);
      }
      Tours.place(st);
      setTimeout(() => Tours.place(st), 260);
    },
    place(st) {
      const step = st.tour.steps[st.i];
      let el = null;
      if (step.sel) {
        // phones have no rail: point at the tab bar instead
        const phoneSel = st.app.isPhone() && { '#railFiles': '#mtab-files', '#rail': '#mbar', '#debugGroup': '#mtab-more' }[step.sel];
        const all = [...document.querySelectorAll(phoneSel || step.sel)];
        el = all.find((x) => { const r = x.getBoundingClientRect(); return r.width > 0 && r.height > 0; }) || null;
      }
      const pop = st.pop;
      const pw = pop.offsetWidth, ph = pop.offsetHeight;
      const W = window.innerWidth, H = window.innerHeight;
      if (!el) {
        st.spot.style.cssText = `left:${W / 2}px;top:${H / 2}px;width:0;height:0;box-shadow:0 0 0 9999px rgba(30,24,14,.28)`;
        pop.style.left = Math.max(10, (W - pw) / 2) + 'px';
        pop.style.top = Math.max(10, (H - ph) / 2) + 'px';
        return;
      }
      const r = el.getBoundingClientRect();
      const pad = 5;
      st.spot.style.cssText = `left:${r.left - pad}px;top:${r.top - pad}px;width:${r.width + pad * 2}px;height:${r.height + pad * 2}px`;
      let x, y;
      if (r.bottom + ph + 18 < H) { y = r.bottom + 14; x = r.left + r.width / 2 - pw / 2; }
      else if (r.top - ph - 18 > 0) { y = r.top - ph - 14; x = r.left + r.width / 2 - pw / 2; }
      else if (r.right + pw + 18 < W) { x = r.right + 14; y = r.top + r.height / 2 - ph / 2; }
      else if (r.left - pw - 18 > 0) { x = r.left - pw - 14; y = r.top + r.height / 2 - ph / 2; }
      else { x = (W - pw) / 2; y = H - ph - 12; }
      pop.style.left = Math.max(10, Math.min(W - pw - 10, x)) + 'px';
      pop.style.top = Math.max(10, Math.min(H - ph - 10, y)) + 'px';
    },
  };
})(LG);

// ==== ide/help.js ====
// The language reference: every primitive with its inputs, what it does and an example to try,
// plus a few short topic pages.
(function (LG) {
  'use strict';
  const { h, icon } = LG.UI;
  const esc = LG.escapeHtml;

  const Help = LG.Help = {};
  let index = null;

  function build() {
    if (index) return index;
    const entries = (LG.HELP_ENTRIES || []).slice();
    const byName = new Map();
    for (const e of entries) {
      byName.set(e.n.toLowerCase(), e);
      for (const a of e.a || []) byName.set(a.toLowerCase(), e);
    }
    const groups = [];
    for (const e of entries) if (!groups.includes(e.g)) groups.push(e.g);
    index = { entries, byName, groups };
    return index;
  }
  Help.find = (w) => build().byName.get(String(w || '').toLowerCase()) || null;
  /** A short description for the editor callout */
  Help.brief = function (w) {
    const e = Help.find(w);
    if (!e || e.topic) return null;
    const first = (e.d || '').replace(/<[^>]+>/g, '').split(/(?<=\.)\s/)[0];
    return h('div', h('div', { style: { font: '700 13px var(--font-code)', color: 'var(--c-prim)' } }, e.s), h('div', { style: { fontSize: '12.5px', marginTop: '4px', color: 'var(--ink-2)' } }, first), h('div.muted', { style: { fontSize: '11.5px', marginTop: '6px' } }, 'F1 for more'));
  };

  Help.open = function (app, word) {
    const ix = build();
    let current = word ? Help.find(word) : null;
    let group = current ? current.g : ix.groups[0];
    const search = h('input', { type: 'text', placeholder: 'Search, e.g. forward, list, color', 'aria-label': 'Search the reference', id: 'helpSearch', spellcheck: 'false', autocapitalize: 'off' });
    const nav = h('div.sheet-nav');
    const main = h('div.sheet-main', { id: 'helpMain' });
    const searchBox = h('div', { style: { padding: '4px 2px 8px' } }, search);
    const renderNav = () => {
      // keep the search box in the page: taking it out would lose the focus after every key typed
      while (nav.lastChild && nav.lastChild !== searchBox) nav.lastChild.remove();
      if (!searchBox.parentNode) nav.appendChild(searchBox);
      for (const g of ix.groups) {
        const n = ix.entries.filter((e) => e.g === g).length;
        const it = h('div.nav-item' + (g === group && !search.value ? '.active' : ''), { role: 'button', tabindex: '0' }, h('span', g), h('span.n', String(n)));
        it.addEventListener('click', () => { group = g; current = null; search.value = ''; render(); });
        nav.appendChild(it);
      }
    };
    const entryView = (e) => {
      const box = h('div.help-entry');
      box.appendChild(h('div', { style: { display: 'flex', alignItems: 'center', gap: '8px' } },
        h('button.small-btn', { type: 'button', onclick: () => { current = null; group = e.g; search.value = ''; render(); } }, '◀ ' + e.g), h('span.muted', { style: { fontSize: '12px' } }, e.topic ? 'Topic' : 'Primitive')));
      box.appendChild(h('h3', e.n + ((e.a && e.a.length) ? '   ' + e.a.join('  ') : '')));
      if (e.s) box.appendChild(h('div.syn', e.s));
      box.appendChild(h('div', { html: e.d || '' }));
      if (e.e) {
        box.appendChild(h('div.vsec', { style: { padding: '12px 0 4px' } }, 'Example'));
        box.appendChild(h('pre', e.e));
        const tryIt = h('button.btn.primary', { type: 'button', id: 'helpTry' }, 'Try it');
        tryIt.addEventListener('click', () => {
          if (app.isBusy()) { LG.UI.toast('Stop the running program first', 'err'); return; }
          closeFn(null);
          if (app.isPhone()) app.setView('turtle');
          const lines = e.e.split('\n');
          if (lines.some((l) => /^\s*(to|\.macro)\s/i.test(l))) {   // definitions need the editor: TO and .MACRO cannot be typed on one line
            LG.Tours.scratch(app, 'try-' + e.n.replace(/[^\w]/g, '') + '.lgo', e.e + '\n');
            app.runActive();
          } else {
            app.commander.echo(e.e);
            app.runCommand(e.e);
          }
        });
        box.appendChild(h('div', { style: { marginTop: '8px', display: 'flex', gap: '8px' } }, tryIt));
      }
      if (e.see && e.see.length) {
        box.appendChild(h('div.vsec', { style: { padding: '14px 0 4px' } }, 'See also'));
        const row = h('div', { style: { display: 'flex', gap: '6px', flexWrap: 'wrap' } });
        for (const s of e.see) { const x = Help.find(s); if (!x) continue; const b = h('button.small-btn', { type: 'button' }, s); b.addEventListener('click', () => { current = x; render(); }); row.appendChild(b); }
        box.appendChild(row);
      }
      return box;
    };
    const listView = (items, title) => {
      const box = h('div');
      if (title) box.appendChild(h('div.vsec', { style: { padding: '6px 0 6px' } }, title));
      if (!items.length) box.appendChild(h('div.empty', 'Nothing found. Try a shorter word.'));
      for (const e of items) {
        const row = h('div.list-row.clickable', { tabindex: '0', role: 'button' },
          h('span.code', { style: { color: 'var(--c-prim)', minWidth: '150px', fontWeight: '700' } }, e.n), h('span.grow', (e.d || '').replace(/<[^>]+>/g, '').split(/(?<=\.)\s/)[0]));
        row.addEventListener('click', () => { current = e; render(); });

        box.appendChild(row);
      }
      return box;
    };
    const render = () => {
      renderNav();
      main.innerHTML = '';
      main.scrollTop = 0;
      if (current) { main.appendChild(entryView(current)); return; }
      const q = search.value.trim().toLowerCase();
      if (q) {
        const hits = ix.entries.filter((e) => e.n.toLowerCase().includes(q) || (e.a || []).some((a) => a.toLowerCase().includes(q)) || (e.d || '').toLowerCase().includes(q));
        hits.sort((a, b) => (b.n.toLowerCase() === q) - (a.n.toLowerCase() === q) || (b.n.toLowerCase().startsWith(q)) - (a.n.toLowerCase().startsWith(q)));
        main.appendChild(listView(hits.slice(0, 200), hits.length + ' found'));
        return;
      }
      main.appendChild(listView(ix.entries.filter((e) => e.g === group), group));
    };
    search.addEventListener('input', () => { current = null; render(); });
    search.addEventListener('keydown', (e) => { if (e.key === 'Enter') { const r = main.querySelector('.list-row'); if (r) r.click(); } });
    if (word && !current) search.value = word;
    render();
    let closeFn = () => {};
    LG.UI.modal({
      title: 'Logo reference', wide: true,
      body: h('div.sheet-grid', nav, main),
      buttons: [{ label: 'Close', value: null }],
      onOpen: (box, close) => { closeFn = close; setTimeout(() => search.focus(), 40); },
    });
    void icon; void esc;
  };
})(LG);

// ==== ide/lessons.js ====
// The Logo course: lessons are guided steps on top of the tour engine, with live checks
// and short quizzes. Progress is remembered in the browser.
(function (LG) {
  'use strict';
  const { h } = LG.UI;
  const store = LG.UI.storage;

  const fileFor = (l) => '/lessons/' + l.id + '.lgo';

  function loadCode(app, lesson, code) {
    const vfs = app.vfs;
    vfs.mkdir('/lessons', { exist: true, trusted: true, readOnly: true });
    const p = fileFor(lesson);
    vfs.writeText(p, code, { trusted: true, readOnly: true });
    const d = app.docByPath(p);
    if (d) { d.editor.setValue(code); d.savedText = code; d.dirty = false; app.renderTabs(); }
    app.openFile(p);
  }

  /**
   * Checks a step can wait for:
   *   {run: true}            the program in the editor ran and finished
   *   {command: 'regex'}     something matching was typed in the command center
   *   {codeHas: 'regex'}     the editor contains it
   *   {output: 'regex'}      the program or a command printed it (since the step began)
   *   {drawn: n}             the turtle drew at least n lines since the step began
   *   {defined: 'name'}      a procedure with that name exists
   *   {paused: true}         the program is paused in the debugger
   *   {breakpoint: true}     there is a breakpoint in the lesson file
   *   {variable: 'name', value: 'regex'}  a global variable has a matching value
   */
  function makeWait(c, lesson) {
    if (c.run) return [(a, x) => (a.runCount || 0) > x.runs && a.interp.state === 'idle', 'Waiting for you to run the program (F5)…'];
    if (c.command) { const re = new RegExp(c.command, 'i'); return [(a, x) => (a.commandLog || []).slice(x.cmds).some((t) => re.test(t)) && !a.isBusy(), 'Waiting for your command…']; }
    if (c.codeHas) { const re = new RegExp(c.codeHas, 'i'); return [(a) => !!a.active && re.test(a.active.editor.getValue()), 'Waiting for your change to the program…']; }
    if (c.output) { const re = new RegExp(c.output, 'i'); return [(a, x) => { const n = (a.outputLen || 0) - x.out; return n > 0 && re.test((a.outputTail || '').slice(-n)) && !a.isBusy(); }, 'Waiting for the right output…']; }
    if (c.drawn) return [(a, x) => (a.world.drawnTotal || 0) - (x.drawn0 || 0) >= c.drawn, 'Waiting for the turtle to draw…'];
    if (c.defined) { const k = String(c.defined).toLowerCase(); return [(a) => a.interp.procs.has(k), 'Waiting for ' + c.defined.toUpperCase() + ' to be defined…']; }
    if (c.paused) return [(a) => a.interp.state === 'paused', 'Waiting for the program to pause…'];
    if (c.breakpoint) return [(a) => { const b = a.breakpoints.get(fileFor(lesson)); return !!(b && b.size); }, 'Waiting for a breakpoint…'];
    if (c.variable) { const re = new RegExp(c.value || '.', 'i'); const k = c.variable.toLowerCase(); return [(a) => { const v = a.interp.globals.get(k); return v !== undefined && re.test(LG.Data.showText(v)); }, 'Waiting for :' + c.variable + '…']; }
    return [null, ''];
  }

  function toTour(app, lesson, idx) {
    const L = LG.LESSONS;
    const steps = lesson.steps.map((s) => {
      const st = { title: s.title, text: s.text, sel: s.sel, hint: s.hint, quiz: s.quiz };
      st.action = (a) => {
        if (s.code !== undefined) loadCode(a, lesson, s.code);
        else if (!a.docByPath(fileFor(lesson)) && a.vfs.exists(fileFor(lesson))) a.openFile(fileFor(lesson), { noFocus: true });
        if (s.tab) a.inspector.show(s.tab);
      };
      st.enter = (a, x) => { x.seg = a.world.segments; x.drawn0 = a.world.drawnTotal || 0; };
      if (s.check) { const [w, t] = makeWait(s.check, lesson); if (w) { st.wait = w; st.waitText = s.waitText || t; } }
      return st;
    });
    const next = L[idx + 1];
    return {
      title: lesson.title,
      label: 'Lesson ' + (idx + 1),
      steps,
      finishLabel: next ? 'Done. Next lesson' : 'Done',
      onFinish: (a) => {
        Lessons.complete(lesson.id);
        if (next) setTimeout(() => Lessons.start(a, idx + 1), 300);
        else LG.UI.toast('You finished every lesson. Well done!', 'ok', 6000);
      },
    };
  }

  const Lessons = LG.Lessons = {
    fileFor,
    done() { return new Set(store.get('lessonsDone', [])); },
    complete(id) { const d = Lessons.done(); d.add(id); store.set('lessonsDone', [...d]); store.set('lessonLast', id); },
    startById(app, id) { const i = (LG.LESSONS || []).findIndex((l) => l.id === id); if (i >= 0) Lessons.start(app, i); },
    start(app, idx) {
      const L = LG.LESSONS || [];
      const lesson = L[idx];
      if (!lesson) return;
      store.set('lessonLast', lesson.id);
      // a program left paused (say by the debugger lesson) would make F5 continue it instead of running the lesson
      if (app.interp.state === 'paused' || app.isBusy()) app.stop();
      if (lesson.tour) {
        const base = LG.Tours.TOURS[lesson.tour];
        const next = L[idx + 1];
        LG.Tours.start(app, Object.assign({}, base, {
          label: 'Lesson ' + (idx + 1),
          finishLabel: next ? 'Done. Next lesson' : 'Done',
          onFinish: (a) => { Lessons.complete(lesson.id); if (next) setTimeout(() => Lessons.start(a, idx + 1), 300); },
        }));
        return;
      }
      LG.Tours.start(app, toTour(app, lesson, idx));
    },
    async browse(app) {
      LG.Tours.stop();
      const L = LG.LESSONS || [];
      const done = Lessons.done();
      const units = [];
      for (const l of L) if (!units.includes(l.unit)) units.push(l.unit);
      let unit = null;
      const lastId = store.get('lessonLast', null);
      const lastIdx = L.findIndex((l) => l.id === lastId);
      unit = lastIdx >= 0 ? L[lastIdx].unit : units[0];
      const nav = h('div.sheet-nav');
      const main = h('div.sheet-main', { id: 'learnMain' });
      let closeFn = () => {};
      const render = () => {
        nav.innerHTML = '';
        const pct = L.length ? Math.round(done.size / L.length * 100) : 0;
        nav.appendChild(h('div', { style: { padding: '6px 10px 10px', fontSize: '12.5px', color: 'var(--ink-2)' } }, h('b', pct + '%'), ' done · ' + done.size + ' of ' + L.length));
        for (const u of units) {
          const ls = L.filter((l) => l.unit === u);
          const n = ls.filter((l) => done.has(l.id)).length;
          const it = h('div.nav-item' + (u === unit ? '.active' : ''), { role: 'button', tabindex: '0' }, h('span', u), h('span.n', n + '/' + ls.length));
          it.addEventListener('click', () => { unit = u; render(); });
          nav.appendChild(it);
        }
        main.innerHTML = '';
        const box = h('div.lesson-unit', h('h4', unit));
        L.forEach((l, i) => {
          if (l.unit !== unit) return;
          const row = h('div.lesson-row' + (done.has(l.id) ? '.done' : ''), { role: 'button', tabindex: '0', id: 'lesson-' + l.id },
            h('span.num', done.has(l.id) ? '✓' : String(i + 1)),
            h('div', { style: { flex: '1', minWidth: '0' } }, h('div.t', l.title), h('div.s', l.summary)),
            h('span.tagc', l.level), h('span.muted', { style: { fontSize: '11.5px', whiteSpace: 'nowrap' } }, (l.minutes || 5) + ' min'));
          const go = () => { closeFn(null); Lessons.start(app, i); };
          row.addEventListener('click', go);
          row.addEventListener('keydown', (e) => { if (e.key === 'Enter') { e.preventDefault(); go(); } });   // else the Enter also clicks the Learn button that gets focus back
          box.appendChild(row);
        });
        main.appendChild(box);
      };
      render();
      const nextIdx = Math.max(0, L.findIndex((l) => !done.has(l.id)));
      const r = await LG.UI.modal({
        title: 'Learn Logo', wide: true,
        body: h('div', { style: { display: 'flex', flexDirection: 'column', height: '100%', minHeight: '0' } },
          h('p', { style: { marginTop: '0' } }, L.length + ' lessons, from the first FORWARD to recursion, lists and games. Each one guides you through the real screen and checks your work as you go.'),
          h('div.sheet-grid', { style: { flex: '1', minHeight: '0' } }, nav, main)),
        buttons: [{ label: 'Close', value: null }, { label: 'Forget my progress', value: 'reset' }, { label: done.size ? 'Carry on' : 'Start lesson 1', value: 'go', primary: true }],
        onOpen: (b, c) => { closeFn = c; },
      });
      if (r === 'go') Lessons.start(app, nextIdx);
      if (r === 'reset' && await LG.UI.confirm('Forget progress?', 'Clear the tick marks on every lesson?', 'Forget')) store.set('lessonsDone', []);
    },
  };
})(LG);

// ==== ide/library.js ====
// The program library: hundreds of commented Logo programs in categories. The texts are packed
// into one compressed string and unpacked the first time the library is opened.
(function (LG) {
  'use strict';
  const { h } = LG.UI;
  const store = LG.UI.storage;
  let texts = null;

  async function load() {
    if (texts) return texts;
    const L = LG.LIBRARY;
    const bin = atob(L.blob);
    const bytes = new Uint8Array(bin.length);
    for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
    const res = new Response(new Blob([bytes]).stream().pipeThrough(new DecompressionStream('deflate-raw')));
    texts = JSON.parse(await res.text());
    return texts;
  }

  const Library = LG.Library = {
    load,
    /** Copy one program (and any helper files in its folder) to /library/<category>/ */
    async install(app, path) {
      const t = await load();
      if (typeof t[path] !== 'string') throw new Error(path + ' is not in the library');
      const vfs = app.vfs;
      const cat = path.split('/')[0];
      vfs.mkdir('/library', { exist: true, trusted: true, readOnly: true });
      vfs.mkdir('/library/' + cat, { exist: true, trusted: true, readOnly: true });
      const put = (k) => { const p = '/library/' + k; if (!vfs.exists(p) || vfs.readText(p) !== t[k]) vfs.writeText(p, t[k], { trusted: true, readOnly: true }); };
      put(path);
      // helper files (names starting with an underscore) that programs LOAD
      for (const k of Object.keys(t)) if (k.startsWith(cat + '/_')) put(k);
      return '/library/' + path;
    },
    async open(app, path, run) {
      try {
        const p = await Library.install(app, path);
        const d = app.openFile(p);
        app.expanded.add('/library'); app.expanded.add(('/library/' + path.split('/')[0]).toLowerCase());
        app.renderSide();
        app.setStatus('Opened ' + p + '. Read the comments at the top, then press F5.');
        if (d) d.editor.setCursor(0, 0);
        if (app.isPhone()) app.setView('code');
        if (run) app.runActive();
      } catch (e) { LG.UI.toast('Could not open that program: ' + e.message, 'err'); }
    },
    async browse(app, initialCat) {
      const L = LG.LIBRARY;
      if (!L || !L.items.length) { LG.UI.toast('The library is empty', 'err'); return; }
      const state = Object.assign({ cat: '*', level: '*', q: '' }, store.get('libState', {}));
      if (initialCat) state.cat = initialCat;
      const opened = new Set(store.get('libOpened', []));
      const nav = h('div.sheet-nav');
      const main = h('div.sheet-main', { id: 'libMain' });
      const search = h('input.field', { type: 'text', placeholder: 'Search ' + L.items.length + ' programs', value: state.q, 'aria-label': 'Search programs', id: 'libSearch', spellcheck: 'false' });
      const levels = h('div.seg', { id: 'libLevels' });
      for (const lv of ['*', 'Beginner', 'Intermediate', 'Advanced']) {
        const b = h('button', { type: 'button', dataset: { lv } }, lv === '*' ? 'All' : lv);
        b.addEventListener('click', () => { state.level = lv; render(); });
        levels.appendChild(b);
      }
      let closeFn = () => {};
      const renderNav = () => {
        nav.innerHTML = '';
        const mk = (id, label, n) => {
          const it = h('div.nav-item' + (state.cat === id ? '.active' : ''), { role: 'button', tabindex: '0', dataset: { cat: id } }, h('span', label), h('span.n', String(n)));
          it.addEventListener('click', () => { state.cat = id; render(); });
          it.addEventListener('keydown', (e) => { if (e.key === 'Enter') { state.cat = id; render(); } });
          nav.appendChild(it);
        };
        mk('*', 'Everything', L.items.length);
        for (const c of L.categories) mk(c.id, c.name, c.count);
      };
      const render = () => {
        state.q = search.value;
        store.set('libState', state);
        renderNav();
        for (const b of levels.children) b.classList.toggle('on', b.dataset.lv === state.level);
        const q = state.q.trim().toLowerCase();
        const list = L.items.filter((it) => (state.cat === '*' || it.cat === state.cat)
          && (state.level === '*' || it.level.toLowerCase() === state.level.toLowerCase())
          && (!q || (it.title + ' ' + it.summary + ' ' + it.tags.join(' ') + ' ' + it.path).toLowerCase().includes(q)));
        main.innerHTML = '';
        const cat = state.cat === '*' ? null : L.categories.find((c) => c.id === state.cat);
        main.appendChild(h('div', { style: { display: 'flex', alignItems: 'center', gap: '10px', margin: '2px 0 12px', flexWrap: 'wrap' } },
          h('div', { style: { flex: '1', minWidth: '160px' } }, h('div', { style: { font: '800 17px var(--font-head)' } }, cat ? cat.name : 'Everything'), h('div.muted', { style: { fontSize: '12.5px' } }, cat && cat.blurb ? cat.blurb : list.length + ' programs')),
          levels));
        const grid = h('div.cards');
        for (const it of list.slice(0, 600)) {
          const card = h('div.pcard', { role: 'button', tabindex: '0', title: it.path, dataset: { path: it.path } },
            h('div.t', (opened.has(it.path) ? '✓ ' : '') + it.title),
            h('div.d', it.summary),
            h('div.tags', h('span.tagc.lv-' + it.level.toLowerCase(), it.level), ...it.tags.slice(0, 3).map((t) => h('span.tagc', t))));
          const go = () => { opened.add(it.path); store.set('libOpened', [...opened]); closeFn(null); Library.open(app, it.path); };
          card.addEventListener('click', go);
          card.addEventListener('keydown', (e) => { if (e.key === 'Enter') go(); });
          grid.appendChild(card);
        }
        if (!list.length) grid.appendChild(h('div.empty', 'No programs match that.'));
        main.appendChild(grid);
      };
      search.addEventListener('input', render);
      render();
      load().catch(() => {});
      await LG.UI.modal({
        title: 'Program library', wide: true, selectInput: false,
        body: h('div', { style: { display: 'flex', flexDirection: 'column', height: '100%', minHeight: '0' } },
          h('div', { style: { display: 'flex', gap: '10px', alignItems: 'center', marginBottom: '10px' } }, search),
          h('div.sheet-grid', { style: { flex: '1', minHeight: '0' } }, nav, main)),
        buttons: [{ label: 'Close', value: null }],
        onOpen: (b, c) => { closeFn = c; },
      });
    },
  };
})(LG);

      // the toolbar is rebuilt only when the panel changes, so a click on it is never lost to a redraw
      if (tools.dataset.side !== this.side) { tools.innerHTML = ''; tools.dataset.side = this.side; }
      if (this.side === 'files') { title.textContent = 'Files'; LG.Files.render(this, body, tools); }
      else if (this.side === 'procs') { title.textContent = 'Procedures'; this.renderProcs(body, tools); }
    }
    renderProcs(body, tools) {
      body.innerHTML = '';
      const I = this.interp;
      const procs = [...I.procs.values()].filter((p) => this.settings.showBuried || !I.buried.procs.has(p.key)).sort((a, b) => a.name.localeCompare(b.name));
      const fileProcs = this.active ? this.outline(this.active) : [];
      const list = h('div', { style: { padding: '6px' } });
      if (fileProcs.length) {
        list.appendChild(h('div.vsec', 'In ' + this.active.name));
        for (const p of fileProcs) {
          const r = h('div.proc-row', { tabindex: '0', role: 'button' }, h('span.t', p.title), h('span.s', 'line ' + (p.line + 1)));
          r.addEventListener('click', () => this.goto(this.active.path, p.line));
          r.addEventListener('keydown', (e) => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); r.click(); } });
          list.appendChild(r);
        }
      }
      list.appendChild(h('div.vsec', 'Defined in the workspace (' + procs.length + ')'));
      if (!procs.length) list.appendChild(h('div.side-note', 'Run a program, or type TO followed by a name in the command center, to define procedures. They stay defined until you run again or ERASE them.'));
      for (const p of procs) {
        const where = p.file ? p.file.replace(/^.*\//, '') + ':' + p.ln : 'typed at the prompt';
        const r = h('div.proc-row', { tabindex: '0', role: 'button', title: 'Show where it is defined' }, h('span.t', I.procSource(p).split('\n')[0]), h('span.s', where));
        r.addEventListener('click', () => this.editProc(p.key));
        r.addEventListener('keydown', (e) => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); r.click(); } });
        list.appendChild(r);
      }
      body.appendChild(list);
      const refresh = h('button.ibtn', { type: 'button', title: 'Refresh', 'aria-label': 'Refresh' }, icon('refresh'));
      refresh.addEventListener('click', () => this.renderSide());
      if (!tools.childElementCount) tools.appendChild(refresh);
    }
    /** TO lines in a document: [{name, title, line}] */
    outline(d) {
      const out = [];
      d.editor.lines().forEach((l, i) => {
        const m = /^\s*(to|\.macro)\s+(\S+)(.*)$/i.exec(l);
        if (m) out.push({ name: m[2], title: m[1].toLowerCase() + ' ' + m[2] + m[3].replace(/\s*;.*$/, ''), line: i });
      });
      return out;
    }
    workspaceChanged() {
      LG.LogoLang.setUserProcs([...this.interp.procs.keys()]);
      for (const d of this.docs) d.editor.cache.clear();
      if (this.active) this.active.editor.render();
      if (this.side === 'procs') this.renderSide();
      this.inspector.render();
    }

    // ---- mobile views -----------------------------------------------------------------------------
    buildMobile() {
      const bar = document.getElementById('mbar');
      const items = [['turtle', 'turtle', 'Turtle'], ['code', 'edit', 'Code'], ['debug', 'bug', 'Debug'], ['files', 'folder', 'Files'], ['more', 'more', 'More']];
      this.mtabs = {};
      for (const [k, ic, label] of items) {
        const b = h('button.mtab', { type: 'button', id: 'mtab-' + k, 'aria-label': label }, icon(ic), h('span', label));
        b.addEventListener('click', () => (k === 'more' ? this.openMenu(b) : this.setView(k)));
        bar.appendChild(b);
        this.mtabs[k] = b;
      }
      // landscape phones have no tab bar: a small view switcher sits in the top bar
      const mv = document.querySelector('.mviews');
      const seg = h('div.seg');
      for (const [k, label] of [['turtle', 'Turtle'], ['code', 'Code'], ['debug', 'Debug']]) {
        const b = h('button', { type: 'button', dataset: { v: k } }, label);
        b.addEventListener('click', () => this.setView(k));
        seg.appendChild(b);
      }
      mv.appendChild(seg);
      this.mviewSeg = seg;
    }
    isPhone() { return window.innerWidth <= 720 || (window.innerHeight <= 500 && window.innerWidth <= 920); }
    setView(v) {
      this.view = v;
      document.body.dataset.view = v;
      for (const [k, b] of Object.entries(this.mtabs)) b.classList.toggle('active', k === v);
      for (const b of this.mviewSeg.children) b.classList.toggle('on', b.dataset.v === v);
      if (v === 'files') { if (!this.side) this.side = 'files'; this.applySide(); }
      if (v === 'code' && this.active) setTimeout(() => this.active.editor.render(), 0);
      if (v === 'debug') this.inspector.render();
      if (v === 'turtle') setTimeout(() => this.turtleView.resize(), 0);
    }

    // ---- splitters ---------------------------------------------------------------------------------
    bindSplitters() {
      const root = document.documentElement.style;
      const sizes = store.get('sizes', {});
      for (const [k, v] of Object.entries(sizes)) root.setProperty(k, v);
      const save = (k, v) => { sizes[k] = v; store.set('sizes', sizes); };
      const stage = document.getElementById('stage');
      LG.UI.splitter(document.getElementById('splitRight'), (e) => {
        const r = stage.getBoundingClientRect();
        const w = LG.clamp(r.right - e.clientX, 300, r.width - 310);
        const v = (w / r.width * 100).toFixed(1) + '%';
        root.setProperty('--right-w', v); save('--right-w', v);
      });
      const left = document.getElementById('leftCol');
      LG.UI.splitter(document.getElementById('splitCmd'), (e) => {
        const r = left.getBoundingClientRect();
        const hh = LG.clamp(r.bottom - e.clientY, 90, r.height - 160);
        const v = (hh / r.height * 100).toFixed(1) + '%';
        root.setProperty('--cmd-h', v); save('--cmd-h', v);
      });
      const right = document.getElementById('rightCol');
      LG.UI.splitter(document.getElementById('splitInsp'), (e) => {
        const r = right.getBoundingClientRect();
        const hh = LG.clamp(r.bottom - e.clientY, 80, r.height - 140);
        const v = (hh / r.height * 100).toFixed(1) + '%';
        root.setProperty('--insp-h', v); save('--insp-h', v);
      });
      // keyboard resizing for the splitters
      for (const [id, prop, dir] of [['splitRight', '--right-w', 1], ['splitCmd', '--cmd-h', 1], ['splitInsp', '--insp-h', 1]]) {
        const el = document.getElementById(id);
        el.tabIndex = 0;
        el.addEventListener('keydown', (e) => {
          const keys = id === 'splitRight' ? ['ArrowLeft', 'ArrowRight'] : ['ArrowUp', 'ArrowDown'];
          const i = keys.indexOf(e.key);
          if (i < 0) return;
          e.preventDefault();
          const cur = parseFloat(getComputedStyle(document.documentElement).getPropertyValue(prop)) || 40;
          const v = LG.clamp(cur + (i === 0 ? 2 : -2) * dir, 18, 75).toFixed(1) + '%';
          root.setProperty(prop, v); save(prop, v);
        });
      }
    }
    toggleBigWorld(on) {
      const card = document.getElementById('worldCard');
      const big = on === undefined ? !card.classList.contains('fullscreen') : on;
      card.classList.toggle('fullscreen', big);
      setTimeout(() => this.turtleView.resize(), 0);
    }

    // ---- the interpreter's view of the screen and keyboard ---------------------------------------
    makeIO() {
      const tv = this.turtleView.io();
      const cmd = this.commander;
      let textSize = 14;
      return Object.assign(tv, {
        print: (t) => cmd.write(t),
        clearText: () => cmd.clearText(),
        setCursor: (x, y) => cmd.setCursor(x, y),
        cursor: () => cmd.cursor(),
        setTextColor: (fg) => {
          const c = this.world.color(fg, D);
          cmd.flush();
          cmd.color = c ? 'rgb(' + c.rgb.join(',') + ')' : null;
        },
        textSize: () => textSize,
        setTextSize: (n) => { textSize = n; document.getElementById('transcript').style.fontSize = n + 'px'; },
        setFont: (f) => { document.getElementById('transcript').style.fontFamily = f + ', var(--font-code)'; this.fontName = f; },
        font: () => this.fontName || 'monospace',
        layout: (mode) => this.screenLayout(mode),
        screenMode: () => this.screenModeName || 'split',
      });
    }
    screenLayout(mode) {
      this.screenModeName = mode;
      if (mode === 'full') this.toggleBigWorld(true);
      else this.toggleBigWorld(false);
      if (mode === 'text' && this.isPhone()) this.setView('turtle');
    }

    // ---- running -------------------------------------------------------------------------------------
    isBusy() { return this.interp.isBusy(); }
    bindInterp() {
      const I = this.interp;
      I.on('state', () => this.updateUI());
      I.on('paused', (why) => this.onPaused(why));
      I.on('error', (e) => this.onError(e));
      I.on('immediateError', (e) => { this.commander.error(e); this.updateUI(); });
      I.on('immediateDone', (v) => {
        if (v !== undefined) this.commander.line('out', D.showText(v, { width: 100, depth: 6 }));
        this.inspector.tree.mark();
        this.inspector.render();
        if (I.continueRequested) { I.continueRequested = false; this.continue(); }
      });
      I.on('done', (v) => this.onDone(v));
      // the slowest speeds light up each instruction in the editor as it runs
      I.on('slowStep', () => { if (I.speedDelay >= 250 && this.selFrame === null) { this.showExec(); this.slowMarks = true; } });
      I.on('halted', (why) => {
        this.clearExec();
        if (why === 'stop') this.commander.note('Stopped.');
        if (why === 'bye') this.commander.note('Bye! (BYE ends the program here; the page stays open.)');
        this.endRun();
      });
      I.on('needInput', (req) => {
        if (req.kind === 'line') this.commander.startReading(req);
        else if (req.kind === 'char') {
          const c = document.getElementById('worldCanvas');
          if (document.activeElement !== this.commander.input) c.focus({ preventScroll: true });
          this.setStatus('Waiting for a key: click the turtle world and press a key');
        }
      });
      I.on('defined', () => { this.wsDirty = true; });
      I.on('erased', () => { this.wsDirty = true; });
      I.on('edit', (what) => this.editWorkspace(what));
      I.on('editfile', (p) => this.openFile(p));
      I.on('help', (w) => LG.Help && LG.Help.open(this, w));
      I.on('saved', () => { this.renderSide(); this.refreshDocsFromDisk(); });
      I.askWrite = (path) => LG.UI.confirm('Let the program write a file?', 'Your program wants to change <b>' + LG.escapeHtml(path) + '</b> in a folder you mounted from your computer. Allow it?', 'Allow');
      // files changed by programs (OPENWRITE, ERASEFILE...) show up in the tree, and unchanged open tabs follow them
      this.vfs.on('change', () => { clearTimeout(this.fsTimer); this.fsTimer = setTimeout(() => { if (this.side === 'files') this.renderSide(); this.refreshDocsFromDisk(); }, 120); });
    }
    /** Run the active file: define its procedures and run its instructions */
    runOrContinue() {
      if (this.interp.state === 'paused') { this.continue(); return; }
      this.runActive();
    }
    runActive(opts) {
      opts = opts || {};
      const d = this.active;
      if (!d) { LG.UI.toast('Open or create a program first', 'err'); return; }
      if (this.isBusy()) return;
      if (this.interp.state === 'paused' || this.interp.state === 'error') this.interp.halt();
      this.autosaveAll();
      this.prepareRun(d.name);
      this.syncBreakpoints();
      if (opts.arm) opts.arm();   // run to here: a one-off breakpoint that must exist before the first instruction
      this.runCount = (this.runCount || 0) + 1;
      this.lastRunPath = d.path;
      try {
        this.interp.loadText(d.editor.getValue(), d.path, { stepMode: opts.step ? { mode: 'into', depth: 0 } : null });
      } catch (e) {
        this.onError(e);
      }
    }
    prepareRun(label) {
      const I = this.interp;
      this.clearExec();
      this.clearErrorMarks();
      this.problems = [];
      this.commander.setProblems([]);
      this.commander.stopReading();
      this.selFrame = null;
      this.inspector.tree.state.prev.clear(); this.inspector.tree.state.seen.clear();   // a new run starts with no change highlights
      this.turtleView.reset();
      if (I.clearHandlers) I.clearHandlers();
      if (I.files_open) { for (const k of [...I.files_open.keys()]) I.files_open.delete(k); I.reader = null; I.writer = null; }
      if (this.settings.freshRun) {
        // a fresh start: forget procedures and variables from earlier runs, clear the drawing
        for (const k of [...I.procs.keys()]) if (!I.buried.procs.has(k)) I.procs.delete(k);
        for (const k of [...I.globals.keys()]) if (!I.buried.names.has(k)) I.globals.delete(k);
        for (const k of [...I.plists.keys()]) if (!I.buried.plists.has(k)) I.plists.delete(k);
        I.gen++;
        this.wsDirty = true;   // forgotten procedures must lose their colour and leave the Procedures panel
        this.world.reset();
        this.world.palette = LG.TurtleWorld.PALETTE.map((c) => c.slice());
      }
      this.hideWelcome();
      this.commander.endPage();
      this.commander.note('▶ Running ' + label);
      this.runStart = performance.now();
      this.runCount0 = I.count;
    }
    /** Run a line typed in the command center */
    runCommand(text) {
      const I = this.interp;
      this.hideWelcome();
      (this.commandLog || (this.commandLog = [])).push(text);
      if (this.commandLog.length > 500) this.commandLog.splice(0, 100);
      if (I.state === 'paused' || I.state === 'error') {
        try {
          I.runImmediate(text, this.selFrame === null ? undefined : this.selFrame);
        } catch (e) { this.commander.error(e); }
        return;
      }
      if (this.isBusy()) { this.commander.note('The program is still running. Press Stop (or Pause) first.'); return; }
      this.syncBreakpoints();
      this.selFrame = null;
      this.clearExec();
      try { I.runText(text, { wantValue: true, label: 'command' }); } catch (e) { this.commander.error(e); }
    }
    stop() {
      if (this.interp.clearHandlers) this.interp.clearHandlers();
      if (this.interp.state === 'idle') return;
      this.interp.halt();
      this.commander.stopReading();
      this.clearExec();
      this.endRun();
      this.updateUI();
    }
    pause() { if (this.isBusy()) this.interp.requestPause(); }
    continue() {
      if (this.interp.state !== 'paused') return;
      this.clearExec();
      this.selFrame = null;
      this.interp.resume(null);
    }
    step(mode) {
      const I = this.interp;
      if (I.state === 'paused') { this.clearExec(); this.selFrame = null; I.resume(mode); return; }
      if (mode === 'out') return;   // nothing to step out of (the Out button is disabled too)
      if (I.state === 'idle' || I.state === 'error') {
        if (I.state === 'error') I.halt();
        this.runActive({ step: true });
      }
    }
    onPaused(why) {
      this.selFrame = null;
      this.showExec();
      this.inspector.tree.mark();
      this.inspector.render();
      const f = this.inspector.frame();
      const where = f && f.proc ? ' in ' + f.proc.name : '';
      const msgs = { breakpoint: 'Stopped at a breakpoint' + where, step: 'Paused' + where, pause: 'Paused' + where, stepped: 'Stepping through ' + (f && f.proc ? f.proc.name : ''), watch: 'A watch changed' + where };
      this.setStatus((msgs[why] || 'Paused') + '. F5 continues, F10 steps over, F11 steps in.');
      if (why === 'watch') this.inspector.show('watch');
      if (this.isPhone() && this.view === 'turtle' && why !== 'pause') this.setView('code');
      this.updateUI();
    }
    onError(e) {
      this.commander.flush();
      this.commander.error(e);
      const I = this.interp;
      const path = e.src !== undefined ? I.filePath(e.src) : null;
      this.problems = [{ message: e.message, path, ln: e.ln, err: e }];
      this.commander.setProblems(this.problems);
      if (path && e.ln) this.markError(path, e.ln - 1);
      this.selFrame = null;
      this.inspector.render();
      this.setStatus('Error: ' + e.message + (e.procName ? ' (in ' + e.procName + ')' : ''));
      this.endRun();
      this.updateUI();
    }
    onDone(v) {
      if (v !== undefined) this.commander.line('out', D.showText(v, { width: 200, depth: 8 }));
      this.endRun();
    }
    endRun() {
      this.commander.stopReading();
      if (this.slowMarks) { this.slowMarks = false; this.clearExecMarks(); }
      if (this.wsDirty) { this.wsDirty = false; this.workspaceChanged(); }
      if (this.runStart && this.interp.state === 'idle') {
        const ms = performance.now() - this.runStart;
        this.runStart = 0;
        const n = this.interp.count - (this.runCount0 || 0);
        this.setStatus('Finished in ' + (ms < 1000 ? Math.round(ms) + ' ms' : (ms / 1000).toFixed(1) + ' s') + ' · ' + n.toLocaleString() + ' instruction' + (n === 1 ? '' : 's'));
      }
      this.inspector.tree.mark();
      this.inspector.render();
      this.updateUI();
    }
    afterEdit() { this.inspector.render(); }

    // ---- breakpoints ---------------------------------------------------------------------------------
    toggleBreakpoint(path, line) {
      let m = this.breakpoints.get(path);
      if (!m) { m = new Map(); this.breakpoints.set(path, m); }
      if (m.has(line)) m.delete(line); else m.set(line, { cond: '', disabled: false });
      this.breakpointsChanged(path);
    }
    breakpointsChanged(path) {
      const m = this.breakpoints.get(path);
      if (m && !m.size) this.breakpoints.delete(path);
      const d = this.docByPath(path);
      if (d) d.editor.setBreakpoints(this.breakpoints.get(path) || new Map());
      const obj = {};
      for (const [p, mm] of this.breakpoints) obj[p] = [...mm];
      store.set('breakpoints', obj);
      this.syncBreakpoints();
      this.inspector.render();
    }
    clearBreakpoints() { const paths = [...this.breakpoints.keys()]; this.breakpoints.clear(); paths.forEach((p) => this.breakpointsChanged(p)); }
    async conditionalBreakpoint(path, line) {
      const m = this.breakpoints.get(path) || new Map();
      const cur = m.get(line);
      const v = await LG.UI.prompt('Stop only when…', 'Stop at line ' + (line + 1) + ' only when this is true (leave empty to always stop):', cur ? cur.cond : '', { hint: 'Examples:  :n = 3    :size < 10    emptyp :list' });
      if (v === null || v === undefined) return;
      if (!this.breakpoints.has(path)) this.breakpoints.set(path, m);
      m.set(line, { cond: v.trim(), disabled: false });
      this.breakpointsChanged(path);
    }
    /** Copy the editor's breakpoints into the interpreter (keyed by file id and line) */
    syncBreakpoints() {
      const I = this.interp;
      I.breakpoints.clear();
      for (const [path, m] of this.breakpoints) {
        const src = I.fileId(path);
        for (const [line, bp] of m) if (!bp.disabled) I.breakpoints.set(src + ':' + (line + 1), bp);
      }
      this.syncWatchpoints();
    }
    syncWatchpoints() {
      const I = this.interp;
      const ws = this.inspector ? this.inspector.watches.filter((w) => w.mode) : [];
      if (!ws.length) { I.stepHook = null; return; }
      const last = new Map();
      I.stepHook = (fr) => {
        for (const w of ws) {
          let v;
          try { v = D.showText(I.peek(w.expr, fr.scope)); } catch (e) { v = undefined; }
          const prev = last.get(w);
          last.set(w, v);
          if (w.mode === 'change' && prev !== undefined && v !== prev) return true;
          if (w.mode === 'true' && v === 'true' && prev !== 'true') return true;
        }
        return false;
      };
    }

    // ---- showing where the program is ---------------------------------------------------------------
    showExec() {
      this.clearExecMarks();
      const frames = LG.Debug.frames(this.interp);
      if (!frames.length) return;
      const top = frames[frames.length - 1];
      const sel = this.selFrame === null || this.selFrame >= frames.length ? frames.length - 1 : this.selFrame;
      const show = (f, kind) => {
        if (!f.file || !f.line) return;
        const d = this.openFile(f.file, { noFocus: kind !== 'exec' });
        if (!d) return;
        if (kind === 'exec') d.editor.setExec(f.line - 1); else d.editor.setFrame(f.line - 1);
        if (this.active !== d && kind === 'frame') this.activate(d);
      };
      show(top, 'exec');
      if (sel !== frames.length - 1) show(frames[sel], 'frame');
    }
    clearExecMarks() { for (const d of this.docs) { d.editor.setExec(null); d.editor.setFrame(null); } }
    clearExec() { this.clearExecMarks(); this.callout.hide(); }
    selectFrame(i) {
      this.selFrame = i;
      this.showExec();
      this.inspector.render();
    }
    markError(path, line) {
      const d = this.openFile(path);
      if (d) { d.editor.setError(line); this.activate(d); }
    }
    clearErrorMarks() { for (const d of this.docs) d.editor.setError(null); }
    gotoError(e) {
      const I = this.interp;
      const path = e.src !== undefined ? I.filePath(e.src) : null;
      if (!path || !e.ln) return;
      this.goto(path, e.ln - 1);
      const d = this.docByPath(path);
      if (d) d.editor.setError(e.ln - 1);
    }
    goto(path, line) {
      const d = this.openFile(path);
      if (!d) return;
      this.activate(d);
      if (this.isPhone()) this.setView('code');
      setTimeout(() => { d.editor.setCursor(line, 0); d.editor.revealLine(line); d.editor.flashLine(line); d.editor.focus(); }, 0);
    }
    editProc(key) {
      const p = this.interp.procs.get(key);
      if (!p) return;
      if (p.file && this.vfs.exists(p.file)) { this.goto(p.file, (p.ln || 1) - 1); return; }
      this.newScratch(this.interp.procSource(p) + '\n', p.name);
    }
    editWorkspace(what) {
      const I = this.interp;
      for (const k of what.procs || []) { if (I.procs.has(k)) { this.editProc(k); return; } }
      const text = I.workspaceSource(what);
      this.newScratch(text.trim() ? text : '; Nothing to edit yet\n', 'workspace');
    }
    newScratch(text, stem) {
      let n = 1, p;
      do { p = '/projects/' + stem.replace(/[^\w.-]/g, '') + (n > 1 ? n : '') + '.lgo'; n++; } while (this.vfs.exists(p) || this.docByPath(p));
      const d = this.createDoc(p, text);
      d.dirty = true;
      this.activate(d);
      this.renderTabs();
      if (this.isPhone()) this.setView('code');
    }
    lineText(path, line) {
      const d = this.docByPath(path);
      if (d) return d.editor.getLine(line);
      try { return this.vfs.readText(path).split('\n')[line] || ''; } catch (e) { return ''; }
    }

    // ---- documents -------------------------------------------------------------------------------------
    isProtected(path) { return PROTECTED.test(path || ''); }
    docByPath(p) {
      if (!p) return null;
      const k = p.toLowerCase();
      return this.docs.find((d) => d.path.toLowerCase() === k) || null;
    }
    openFile(path, opts) {
      opts = opts || {};
      let display;
      try { display = this.vfs.abs(path); } catch (e) { return null; }
      let d = this.docByPath(display);
      if (!d) {
        let text = '';
        if (this.vfs.exists(display)) {
          if (!this.vfs.isReady(display)) { this.vfs.load(display).then(() => this.openFile(display, opts)); return null; }
          try { text = this.vfs.readText(display).replace(/\r\n?/g, '\n'); } catch (e) { LG.UI.toast(e.message, 'err'); return null; }

    createDoc(path, text) {
      const editor = new LG.Editor(document.getElementById('editors'), { lang: LG.LogoLang, settings: this.settings });
      editor.setValue(text);
      const d = { path, editor, dirty: false, savedText: text, name: path.replace(/^.*\//, '') };
      editor.on('change', () => { d.dirty = editor.getValue() !== d.savedText; this.renderTabs(); editor.setError(null); if (this.side === 'procs') this.renderSideSoon(); });
      editor.on('cursor', () => this.updateStatus());
      editor.on('gutter', (line) => this.toggleBreakpoint(d.path, line));
      editor.on('gutterContext', (line, e) => this.gutterMenu(d, line, e));
      editor.on('bpsShifted', (map) => { this.breakpoints.set(d.path, new Map(map)); this.breakpointsChanged(d.path); });
      editor.on('help', (line, col) => { const w = LG.LogoLang.wordAt(line, col); if (LG.Help) LG.Help.open(this, w ? w.word : ''); });
      editor.on('hover', (pos, x, y) => this.callout.showFor(d, pos, x, y));
      editor.on('hoverOut', () => this.callout.scheduleHide(450));

      editor.on('find', (replace) => this.findDialog(replace));

    renderSideSoon() { clearTimeout(this.sideTimer); this.sideTimer = setTimeout(() => this.renderSide(), 400); }
    activate(d) {

    renderTabs() {

          d.name, d.dirty ? h('span.dot', { title: 'Not saved' }) : null, x);
        t.addEventListener('click', (e) => { if (e.target === x) { this.closeDoc(d); return; } this.activate(d); d.editor.focus(); });

    async closeDoc(d) {
      if (d.dirty) {
        let r;

          r = await LG.UI.modal({
            title: 'Keep your changes?',
            body: h('div', h('p', 'You changed ' + d.name + ', which is one of the originals. The original stays as it was.'), h('p', 'Save your version as a program of your own?')),
            buttons: [{ label: 'Cancel', value: 'cancel' }, { label: 'Throw them away', value: 'no' }, { label: 'Save my copy…', value: 'copy', primary: true }],
            cancelValue: 'cancel',
          });
          if (r === 'cancel') return false;
          if (r === 'copy' && !(await this.saveCopy(d))) return false;
        } else {
          r = await LG.UI.modal({
            title: 'Save changes?', body: h('p', 'Save the changes to ' + d.name + '?'),
            buttons: [{ label: 'Cancel', value: 'cancel' }, { label: "Don't save", value: 'no' }, { label: 'Save as…', value: 'as' }, { label: 'Save', value: 'yes', primary: true }],
            cancelValue: 'cancel',
          });
          if (r === 'cancel') return false;
          if (r === 'yes' && !this.saveDoc(d)) return false;
          if (r === 'as' && !(await this.saveAs(d))) return false;
        }
      }
      const i = this.docs.indexOf(d);
      if (i < 0) return true;
      this.docs.splice(i, 1);
      d.editor.destroy();
      if (this.active === d) this.active = this.docs[Math.max(0, i - 1)] || null;

    saveSession() { store.set('session', { open: this.docs.map((d) => d.path), active: this.active ? this.active.path : null }); }
    restoreSession() {

        const a = s.active && this.docByPath(s.active);
        if (a) this.activate(a); else if (this.docs.length) this.activate(this.docs[0]);
      }
      if (!this.docs.length) {

      }
    }
    saveDoc(d) {
      if (this.isProtected(d.path)) return false;
      try {
        const dir = d.path.replace(/\/[^/]*$/, '') || '/';
        if (!this.vfs.exists(dir)) this.vfs.mkdir(dir, { parents: true, trusted: true });
        this.vfs.writeText(d.path, d.editor.getValue(), { trusted: this.vfs.canWrite(d.path) !== 'no' });
        d.savedText = d.editor.getValue();
        d.dirty = false;

    }
    async save() {

    autosaveAll() {

    async saveCopy(d) {
      const stem = d.name.replace(/\.[^.]*$/, '');
      let n = 1, def;
      do { def = '/projects/' + stem + (n > 1 ? '-' + n : '') + '.lgo'; n++; } while (this.vfs.exists(def) || this.docByPath(def));
      return this.saveAs(d, { title: 'Save your own copy', def, hint: 'This is an original, so your version is saved as a new program of your own. Type a name, or a path like /projects/games/maze.lgo.' });
    }
    async saveAs(d, opts) {
      d = d || this.active;
      opts = opts || {};
      if (!d) return false;
      const name = await LG.UI.prompt(opts.title || 'Save as', 'Name', opts.def || d.path, { hint: opts.hint || 'A name like spiral.lgo saves next to the current program; a path like /projects/art/spiral.lgo picks the folder.' });
      if (!name) return false;
      let p = name.trim();
      if (!/\.[^/.]+$/.test(p)) p += '.lgo';
      if (!p.startsWith('/')) p = (this.isProtected(d.path) ? '/projects' : d.path.replace(/\/[^/]*$/, '')) + '/' + p;
      let disp;
      try { disp = this.vfs.abs(p); } catch (e) { LG.UI.toast('That is not a usable file name', 'err'); return false; }
      if (this.isProtected(disp)) { LG.UI.toast('Pick a folder outside /examples, /library and /lessons, such as /projects', 'err', 5000); return false; }
      if (this.vfs.exists(disp) && disp.toLowerCase() !== d.path.toLowerCase()) {
        if (!(await LG.UI.confirm('Replace?', LG.escapeHtml(disp) + ' already exists. Replace it?', 'Replace'))) return false;

      const bps = this.breakpoints.get(old);
      if (bps && bps.size) { this.breakpoints.set(d.path, new Map(bps)); if (this.isProtected(old)) this.breakpoints.delete(old); this.breakpointsChanged(d.path); }
      this.activate(d);
      LG.UI.toast('Saved ' + d.path, 'ok');

    }

      }
    }

    // ---- keyboard ---------------------------------------------------------------------------------------
    bindKeys() {
      document.addEventListener('keydown', (e) => {
        if (LG.UI.anyModalOpen()) return;
        const k = e.key;
        const ctrl = e.ctrlKey || e.metaKey;
        const handled = () => { e.preventDefault(); e.stopPropagation(); };
        if (k === 'F5' && !e.shiftKey) { handled(); this.runOrContinue(); return; }
        if (k === 'F5' && e.shiftKey) { handled(); this.stop(); return; }
        if (k === 'F11' && e.shiftKey) { handled(); this.step('out'); return; }
        if (k === 'F11' || (k === 'F8' && !e.shiftKey)) { handled(); this.step('into'); return; }
        if (k === 'F8' && e.shiftKey) { handled(); this.step('out'); return; }
        if (k === 'F10') { handled(); this.step('over'); return; }
        if (k === 'F9' && this.active) { handled(); this.toggleBreakpoint(this.active.path, this.active.editor.cursor().line); return; }
        if (k === 'F4') { handled(); this.toggleBigWorld(); return; }
        if (k === 'F1' && !(e.target && e.target.classList && e.target.classList.contains('ed-ta'))) { handled(); if (LG.Help) LG.Help.open(this); return; }
        if ((k === 'Pause' || k === 'Cancel') || (ctrl && k === 'Pause')) { handled(); this.pause(); return; }
        if (ctrl && (k === 's' || k === 'S')) { handled(); if (e.shiftKey) this.saveAs(); else this.save(); return; }
        if (ctrl && (k === 'o' || k === 'O')) { handled(); LG.Files.openDialog(this); return; }
        if (e.altKey && (k === 'n' || k === 'N' || e.code === 'KeyN')) { handled(); LG.Files.newFile(this); return; }
        if (e.altKey && (k === 'w' || k === 'W' || e.code === 'KeyW')) { handled(); if (this.active) this.closeDoc(this.active); return; }
        if (ctrl && (k === '=' || k === '+')) { handled(); this.zoomCode(1); return; }
        if (ctrl && k === '-') { handled(); this.zoomCode(-1); return; }
        if (ctrl && k === '`') { handled(); this.commander.focus(); return; }
        if (k === 'Escape' && document.getElementById('worldCard').classList.contains('fullscreen') && !this.isBusy()) { this.toggleBigWorld(false); return; }
        // Escape inside the callout's value editor cancels the edit there; anywhere else it closes the callout
        if (k === 'Escape' && this.callout.isOpen() && !(e.target && e.target.tagName === 'INPUT' && this.callout.el.contains(e.target))) { this.callout.hide(); }
      }, true);
    }

    async findDialog(replace) {
