(function (LG) {
  LG.SAMPLE_FILES = {"bounce.lgo":"; BOUNCE.LGO - several turtles bouncing around at once\n;\n; TELL picks which turtles the next commands go to. ASK sends commands\n; to one turtle without changing who you are talking to. Each turtle\n; keeps its own position, heading and pen.\n\nto setup\n  for [t 0 4] [\n    ask :t [penup home setheading 20 + 70 * :t setpencolor :t + 1 setshape \"circle showturtle pendown]\n  ]\nend\n\nto move.all\n  for [t 0 4] [\n    ask :t [\n      forward 6\n      if or (xcor > 390) (xcor < -390) [setheading 0 - heading]\n      if or (ycor > 290) (ycor < -290) [setheading 180 - heading]\n    ]\n  ]\nend\n\nclearscreen\nsetup\nrepeat 600 [move.all wait 1]\n","clock.lgo":"; CLOCK.LGO - a clock that keeps time\n;\n; TIME gives the day, date and time as a list. ITEM 4 of it is the time\n; as a word like 14:05:09, and PARSE plus a little trick split it up.\n; WAIT 60 pauses for a second (WAIT counts sixtieths of a second).\n; Press Stop when you have seen enough.\n\nto hand :angle :length :width :color\n  penup home setheading :angle pendown\n  setpensize :width setpencolor :color\n  forward :length\nend\n\nto face\n  penup home pendown\n  setpensize 3 setpencolor \"black\n  penup setxy 0 -200 setheading 90 pendown\n  repeat 360 [forward 200 * 3.14159 / 180 left 1]\n  for [h 1 12] [\n    penup home setheading :h * 30 forward 175 pendown\n    setheading 0 forward 1\n  ]\nend\n\nto tick\n  local [t h m s]\n  make \"t parse map [ifelse ? = \": [\"| |] [?]] item 4 time\n  make \"h item 1 :t  make \"m item 2 :t  make \"s item 3 :t\n  clean\n  face\n  hand (remainder :h 12) * 30 + :m / 2 100 8 [40 40 60]\n  hand :m * 6 + :s / 10 150 5 [40 40 60]\n  hand :s * 6 165 2 \"red\n  hideturtle\nend\n\nclearscreen\nforever [tick wait 60]\n","diary.lgo":"; DIARY.LGO - keep notes in a file that is still there tomorrow\n;\n; OPENAPPEND opens a file and adds to the end of it, SETWRITE sends\n; PRINT there instead of the screen, and SETWRITE [] sends it back.\n; OPENREAD, SETREAD and READLIST read it back one line at a time.\n; The file lives in /projects/diary.txt on your browser's disk.\n\nmake \"file \"/projects/diary.txt\n\nto note :words\n  openappend :file\n  setwrite :file\n  print (sentence first time item 2 time item 3 time \"- :words)\n  setwrite []\n  close :file\nend\n\nto readback\n  if not filep :file [print [The diary is empty.] stop]\n  openread :file\n  setread :file\n  while [not eofp] [print readlist]\n  setread []\n  close :file\nend\n\nprint [What happened today? Type a line and press Enter:]\nnote readlist\nprint [Your diary so far:]\nreadback\n","dragon.lgo":"; DRAGON.LGO - the dragon curve, folded paper made of lines\n;\n; Fold a strip of paper in half again and again, then open every fold\n; to a right angle: the shape you get is the dragon curve. The two\n; procedures call each other, turning left and right in turn.\n\nto dragon :size :level\n  if :level = 0 [forward :size stop]\n  dragon :size :level - 1\n  left 90\n  nogard :size :level - 1\nend\n\nto nogard :size :level\n  if :level = 0 [forward :size stop]\n  dragon :size :level - 1\n  right 90\n  nogard :size :level - 1\nend\n\nclearscreen hideturtle\npenup setxy -120 80 pendown\nsetpencolor [200 60 40]\ndragon 4 12\n","factorial.lgo":"; FACTORIAL.LGO - recursion you can watch, step by step\n;\n; 5! (five factorial) is 5 x 4 x 3 x 2 x 1. A recursive definition says\n; the same thing: the factorial of N is N times the factorial of N - 1,\n; and the factorial of 0 is 1.\n;\n; Try the debugger:\n;   1. Click in the margin next to the line \"if :n = 0 [output 1]\".\n;   2. Press F5. The program stops there.\n;   3. Open Call Stack: one FACTORIAL is waiting inside another.\n;   4. Click an older frame to see its own :n in Variables.\n;   5. Press F5 to continue, or F11 to take one step at a time.\n\nto factorial :n\n  if :n = 0 [output 1]\n  output :n * factorial :n - 1\nend\n\nfor [i 0 10] [print (sentence :i \"! \"= factorial :i)]\n","flower.lgo":"; FLOWER.LGO - petals made of arcs, in every colour of the palette\n;\n; A petal is two arcs back to back. Turning a little after each petal\n; makes a flower. REPCOUNT tells us which time round the loop we are,\n; so we can use it to pick a different colour for each petal.\n\nto petal :size\n  repeat 2 [arc2 60 :size right 120]\nend\n\n; ARC2 walks the turtle along an arc (ARC itself leaves the turtle still)\nto arc2 :angle :radius\n  repeat :angle / 3 [forward :radius * 3.14159 / 60 right 3]\nend\n\nto flower :petals\n  repeat :petals [\n    setpencolor remainder repcount 15\n    petal 120\n    right 360 / :petals\n  ]\nend\n\nclearscreen\nsetpensize 2\nflower 12\nhideturtle\n","guess.lgo":"; GUESS.LGO - guess the number the turtle is thinking of\n;\n; READWORD waits for you to type in the command center and press\n; Enter. NUMBERP checks that what you typed really is a number.\n\nto play\n  make \"secret 1 + random 100\n  make \"tries 0\n  print [I am thinking of a number from 1 to 100.]\n  guess\nend\n\nto guess\n  type [Your guess? ]\n  make \"g readword\n  if not numberp :g [print [That is not a number. Try again.] guess stop]\n  make \"tries :tries + 1\n  if :g < :secret [print [Higher!] guess stop]\n  if :g > :secret [print [Lower!] guess stop]\n  print (sentence [Yes! It was] :secret [and you needed] :tries [tries.])\nend\n\nplay\n","hanoi.lgo":"; HANOI.LGO - the Towers of Hanoi, solved by recursion\n;\n; Move a tower of discs from one peg to another, one disc at a time,\n; never putting a bigger disc on a smaller one. To move N discs: move\n; N-1 out of the way, move the biggest, then move the N-1 back on top.\n\nmake \"moves 0\n\nto hanoi :n :from :to :via\n  if :n = 0 [stop]\n  hanoi :n - 1 :from :via :to\n  make \"moves :moves + 1\n  print (sentence [Move disc] :n [from] :from [to] :to)\n  hanoi :n - 1 :via :to :from\nend\n\nhanoi 4 \"left \"right \"middle\nprint (sentence [That took] :moves [moves.])\n","mouse.lgo":"; MOUSE.LGO - draw with the mouse\n;\n; MOUSEON takes five instruction lists: what to do when the left button\n; goes down, when it comes up, the same for the right button, and when\n; the mouse moves. The program keeps running in the background while\n; the lists react to the mouse. Press Stop to finish.\n\nmake \"drawing \"false\nto down\n  make \"drawing \"true\n  penup setpos mousepos pendown\nend\nto move\n  if :drawing [setpos mousepos]\nend\n\nclearscreen\nsetpensize 3\nsetpencolor [200 70 140]\nmouseon [down] [make \"drawing \"false] [clean] [] [move]\nprint [Hold the left button down and move the mouse to draw. Right-click to clear.]\nforever [wait 6]\n","multi.lgo":"; MULTI.LGO - one program in two files\n;\n; LOAD reads another file: it defines the procedures in it and runs any\n; instructions it has. Here the shapes live in shapes.lgo, next to this\n; file, and this file uses them.\n\nload \"/examples/shapes.lgo\nclearscreen hideturtle\nfor [i 1 6] [\n  setpencolor :i\n  house 40 + 15 * :i\n  penup right 60 forward 10 pendown\n]\n","music.lgo":"; MUSIC.LGO - a tune played on the speaker\n;\n; SOUND takes a list of pairs: a frequency in hertz and how many\n; milliseconds to play it. A list of note names is turned into\n; frequencies with a property list.\n\npprop \"notes \"c 262  pprop \"notes \"d 294  pprop \"notes \"e 330\npprop \"notes \"f 349  pprop \"notes \"g 392  pprop \"notes \"a 440\npprop \"notes \"b 494  pprop \"notes \"c2 523\n\nto play :tune\n  foreach :tune [\n    sound (list gprop \"notes first ? 220 * last ?)\n  ]\nend\n\n; each note is [name beats]\nplay [[c 1] [c 1] [g 1] [g 1] [a 1] [a 1] [g 2] [f 1] [f 1] [e 1] [e 1] [d 1] [d 1] [c 2]]\n","polygons.lgo":"; POLYGONS.LGO - every regular shape from a triangle to a circle\n;\n; To draw a shape with N sides, turn 360/N after each side. When N is\n; big the shape looks like a circle. FOR counts N for us.\n\nto polygon :sides :length\n  repeat :sides [forward :length right 360 / :sides]\nend\n\nclearscreen hideturtle\nfor [n 3 12] [\n  setpencolor :n\n  polygon :n 260 / :n\n  penup forward 4 pendown\n]\npenup home setxy -120 -220 pendown\nsetpencolor \"black\nlabel [Triangle to dodecagon: turn 360/N each time]\n","rainbow.lgo":"; RAINBOW.LGO - colours mixed from red, green and blue\n;\n; SETPENCOLOR can take a list of three numbers from 0 to 255: how much\n; red, green and blue to mix. Here the mix changes smoothly as the\n; turtle goes round, making a colour wheel.\n\nto wheel\n  for [angle 0 359] [\n    setpencolor (list 127 + 127 * cos :angle\n                      127 + 127 * cos :angle - 120\n                      127 + 127 * cos :angle + 120)\n    penup home setheading :angle forward 60 pendown\n    forward 200\n  ]\nend\n\nclearscreen hideturtle\nsetpensize 4\nwheel\n","shapes.lgo":"; SHAPES.LGO - shapes used by multi.lgo\n; This file only defines procedures, so running it by itself draws\n; nothing. Run multi.lgo instead.\n\nto square :size\n  repeat 4 [forward :size right 90]\nend\n\nto triangle :size\n  repeat 3 [forward :size right 120]\nend\n\nto house :size\n  square :size\n  forward :size right 30\n  triangle :size\n  left 30 back :size\nend\n","sierpinski.lgo":"; SIERPINSKI.LGO - triangles inside triangles inside triangles\n;\n; A Sierpinski triangle is three half-size Sierpinski triangles, one in\n; each corner. FILLED paints the smallest ones in solid colour.\n\nto sierpinski :size :level\n  if :level = 0 [\n    filled pick [[255 120 80] [255 180 60] [240 90 120]] [repeat 3 [forward :size right 120]]\n    stop\n  ]\n  repeat 3 [\n    sierpinski :size / 2 :level - 1\n    forward :size\n    right 120\n  ]\nend\n\nclearscreen hideturtle\npenup setxy -240 -200 setheading 30 pendown\nsierpinski 480 5\n","snake.lgo":"; SNAKE.LGO - steer with the arrow keys and eat the dots\n;\n; Click the turtle world first so it gets your key presses.\n; KEYP says whether a key is waiting; READCHAR reads it. The arrow keys\n; come back as the words LEFT, RIGHT, UP and DOWN.\n\nto setup\n  clearscreen hideturtle\n  setpensize 6\n  make \"score 0\n  make \"dir 0\n  make \"len 12\n  make \"body []\n  make \"x 0 make \"y 0\n  newfood\nend\n\nto newfood\n  make \"food list (random 30) * 20 - 300 (random 24) * 20 - 240\n  penup setpos :food setpencolor \"red pendown forward 0.1\nend\n\nto steer\n  if not keyp [stop]\n  make \"k readchar\n  if :k = \"UP [make \"dir 0]\n  if :k = \"RIGHT [make \"dir 90]\n  if :k = \"DOWN [make \"dir 180]\n  if :k = \"LEFT [make \"dir 270]\nend\n\nto move\n  make \"x :x + 10 * sin :dir\n  make \"y :y + 10 * cos :dir\n  if or (abs :x) > 390 (abs :y) > 290 [print (sentence [Crash! Score:] :score) throw \"toplevel]\n  penup setxy :x :y setpencolor [40 150 70] pendown forward 0.1\n  make \"body fput (list :x :y) :body\n  if (count :body) > :len [\n    penup setpos last :body setpencolor background pendown forward 0.1\n    make \"body butlast :body\n  ]\n  if (distance :food) < 12 [make \"score :score + 1 make \"len :len + 4 newfood]\nend\n\nsetup\nforever [steer move wait 3]\n","snowflake.lgo":"; SNOWFLAKE.LGO - the Koch snowflake, a famous fractal\n;\n; Every straight side is replaced by four shorter sides with a bump in\n; the middle, and every one of those by four more, and so on. The\n; LEVEL input says how many times to do the replacing.\n\nto side :size :level\n  if :level = 0 [forward :size stop]\n  side :size / 3 :level - 1\n  left 60\n  side :size / 3 :level - 1\n  right 120\n  side :size / 3 :level - 1\n  left 60\n  side :size / 3 :level - 1\nend\n\nto snowflake :size :level\n  repeat 3 [side :size :level right 120]\nend\n\nclearscreen\npenup setxy -180 100 setheading 90 pendown\nsetpencolor [30 120 210]\nsnowflake 360 4\nhideturtle\n","sorting.lgo":"; SORTING.LGO - putting a list in order, two different ways\n;\n; Lists are Logo's favourite thing. INSERT puts one number into an\n; already-sorted list; ISORT does that for every number. QSORT picks\n; the first number and sorts the smaller and bigger ones separately.\n; A ~ at the end of a line joins it to the next one.\n\nto insert :x :sorted\n  if emptyp :sorted [output (list :x)]\n  if :x <= first :sorted [output fput :x :sorted]\n  output fput first :sorted insert :x butfirst :sorted\nend\n\nto isort :list\n  if emptyp :list [output []]\n  output insert first :list isort butfirst :list\nend\n\nto qsort :list\n  if emptyp :list [output []]\n  localmake \"pivot first :list\n  output (sentence qsort filter [? < :pivot] butfirst :list ~\n                   :pivot ~\n                   qsort filter [? >= :pivot] butfirst :list)\nend\n\nmake \"numbers [42 7 19 88 3 56 21 64 11 35]\nprint sentence [Unsorted:] :numbers\nprint sentence [Insertion sort:] isort :numbers\nprint sentence [Quicksort:] qsort :numbers\n","spiral.lgo":"; SPIRAL.LGO - a squared spiral that grows a little on every turn\n;\n; Each time round the loop the turtle walks a bit further than the\n; last time and turns a bit less than a right angle. That small\n; mismatch is what makes the square twist into a spiral.\n; Try: change 91 to 89, 120 or 144. Change the 2 to 1 or 4.\n\nto spiral :size :angle :grow\n  if :size > 400 [stop]\n  forward :size\n  right :angle\n  spiral :size + :grow :angle :grow\nend\n\nclearscreen hideturtle\nsetpencolor [40 110 200]\nspiral 2 91 2\n","stars.lgo":"; STARS.LGO - a night sky with stars of every shape\n;\n; A star with an odd number of points can be drawn without lifting the\n; pen: turn by 180 - 180/points after each line. RANDOM picks where\n; each star goes and how big it is.\n\nto star :size :points\n  repeat :points [forward :size right 180 - 180 / :points]\nend\n\nto sky :count\n  repeat :count [\n    penup\n    setxy (random 760) - 380 (random 560) - 280\n    setheading random 360\n    pendown\n    setpencolor pick [yellow white orange [255 240 160]]\n    star 10 + random 30 pick [5 7 9]\n  ]\nend\n\nclearscreen\nsetbackground [12 18 48]\nhideturtle\nsky 40\n","tree.lgo":"; TREE.LGO - a recursive tree: every branch carries two smaller trees\n;\n; This is the classic example of recursion in Logo. TREE draws a trunk,\n; then calls TREE twice for the two branches, each a bit shorter.\n; When the branches get small enough it stops.\n;\n; Debugger tip: put a breakpoint on the \"forward :size\" line (click in\n; the margin) and press F5. Then open the Call Stack tab and press F11\n; a few times: you can see one TREE waiting inside another.\n\nto tree :size\n  if :size < 6 [stop]\n  setpensize :size / 8\n  setpencolor ifelse :size < 15 [[60 160 70]] [[110 70 40]]\n  forward :size\n  left 25\n  tree :size * 0.72\n  right 50\n  tree :size * 0.72\n  left 25\n  back :size\nend\n\nclearscreen\npenup setxy 0 -250 pendown\ntree 110\nhideturtle\n"};
})(LG);

// ==== ide/samples.js ====
// The example programs that come with Lohgo. They live in /examples as originals: anyone can
// open, change and run them, and saving makes a copy of their own.
(function (LG) {
  'use strict';
  const Samples = LG.Samples = {};

  /** Copy the examples onto the disk when they are missing or out of date */
  Samples.install = function (app) {
    const vfs = app.vfs;
    const files = LG.SAMPLE_FILES || {};
    const sig = Object.keys(files).length + ':' + Object.values(files).reduce((a, t) => (a * 31 + t.length) >>> 0, 7);
    const stamp = LG.UI.storage.get('examplesSig', '');
    const missing = !vfs.exists('/examples');
    if (!missing && stamp === sig) return;
    try { if (vfs.exists('/examples')) vfs.rmdir('/examples', { recursive: true, trusted: true }); } catch (e) { /* first time */ }
    vfs.mkdir('/examples', { trusted: true, readOnly: true });
    for (const [rel, text] of Object.entries(files)) {
      const p = '/examples/' + rel;
      const dir = p.replace(/\/[^/]*$/, '');
      if (!vfs.exists(dir)) vfs.mkdir(dir, { parents: true, trusted: true, readOnly: true });
      vfs.writeText(p, text, { trusted: true, readOnly: true });
    }
    LG.UI.storage.set('examplesSig', sig);
  };

  /** The first program a new visitor sees */
  Samples.starter = function () {
    return [
      '; Welcome to Lohgo!',
      '; This is a Logo program. Press F5 (or the green Run button) to run it.',
      '; Then try changing the numbers and running it again.',
      '',
      'to square :size',
      '  repeat 4 [forward :size right 90]',
      'end',
      '',
      'to flower',
      '  repeat 36 [square 80 right 10]',
      'end',
      '',
      'setpencolor "purple',
      'flower',
      '',
    ].join('\n');
  };
})(LG);

// ==== logo/help/00-topics.js ====
// Language reference: topic pages (ideas rather than single primitives).
(function (LG) {
  'use strict';
  LG.HELP_ENTRIES = (LG.HELP_ENTRIES || []).concat([

    { n: 'Getting started', g: 'Topics', topic: true,
      d: `<p>Lohgo has three parts that work together.</p><ul><li><b>The turtle world</b> is the drawing area. The turtle starts in the middle, facing up. When you tell it to move with its pen down, it leaves a line behind.</li><li><b>The command center</b> is where you type one instruction at a time and press Enter. It runs straight away, and anything printed appears there. Use the up arrow to bring back an earlier line.</li><li><b>The editor</b> holds a whole program: procedures you define with <code>TO</code> ... <code>END</code>, and instructions that use them. Press <b>Run</b> (or F5) to run it. Running from the editor starts fresh: the drawing is cleared and old procedures and variables are forgotten. Save with Ctrl+S; programs are kept on the browser's virtual disk under <code>/projects</code>.</li></ul><p>A first try: type <code>forward 100</code>, then <code>right 90</code>, then <code>forward 100</code>. Then try the instruction below, which does the same thing four times.</p><p>The speed slider sets how fast the turtle walks. <b>Stop</b> (Shift+F5) ends a program that runs too long. Press F1 on any word in the editor to see its help page.</p>`,
      e: `repeat 4 [forward 100 right 90]`, see: ['forward', 'right', 'repeat', 'to'] },

    { n: 'Words, numbers and lists', g: 'Topics', topic: true,
      d: `<p>Logo has a few kinds of things, and how you write each one tells Logo what you mean.</p><ul><li><b>Words.</b> A quote mark in front means "this word itself": <code>print "hello</code> prints <code>hello</code>. There is no closing quote. Without the quote, Logo would try to run a procedure called <code>hello</code>. To put a space inside a word, use vertical bars: <code>"|two words|</code>.</li><li><b>Numbers</b> are words too, but need no quote: <code>print 3 + 4</code>.</li><li><b>Values of variables.</b> A colon in front means "the value of": <code>:size</code> is the thing stored under the name <code>size</code>.</li><li><b>Lists</b> are written in square brackets: <code>[red green blue]</code>. Nothing inside a list is run or looked up, so you do not quote the words in it, and <code>[:x]</code> is a list holding the word <code>:x</code>, not its value. Lists can hold other lists: <code>[1 [2 3] 4]</code>. Lists of instructions, like the second input to <code>REPEAT</code>, are run only when the command chooses to.</li><li><b>Arrays</b> are written in braces: <code>{10 20 30}</code>. Like lists they hold several things, but you can change an item in place with <code>SETITEM</code>. They count from 1 unless you add <code>@0</code> after them: <code>{a b}@0</code>.</li></ul><p>To build a list from values, use <code>LIST</code> or <code>SENTENCE</code>: <code>(list :x :y)</code>.</p>`,
      e: `make "x 5 print "hello print :x show [x :x] show list "x :x show item 2 {a b c}`, see: ['print', 'show', 'list', 'sentence', 'make', 'array'] },

    { n: 'Procedures and inputs', g: 'Topics', topic: true,
      d: `<p>You teach Logo a new word with <code>TO</code>. The first line names the procedure and its inputs, then come the instructions, then <code>END</code>:</p><pre>to square :size
  repeat 4 [forward :size right 90]
end</pre><p>Now <code>square 50</code> and <code>square 120</code> both work. Inside, <code>:size</code> is whatever number was given.</p><p><b>Commands and operations.</b> A procedure like <code>SQUARE</code> that does something is a <i>command</i>. A procedure can instead hand back a value with <code>OUTPUT</code>; then it is an <i>operation</i>, and its value must be used by something, such as <code>PRINT</code>. <code>OUTPUT</code> also ends the procedure at once. <code>STOP</code> ends a command early without a value.</p><p><b>Optional inputs.</b> An input written in brackets with a value, like <code>[:sides 4]</code>, is optional: if it is left out it gets that value. To give it, put the whole call in parentheses: <code>(polygon 50 6)</code>.</p><p><b>Rest inputs.</b> An input written alone in brackets, like <code>[:others]</code>, collects any extra inputs into a list, so <code>(total 1 2 3 4)</code> works.</p><p>Common mistakes: forgetting <code>END</code>, putting a space between the colon and the name, and using a value from an operation without doing anything with it (<i>You don't say what to do with ...</i>).</p>`,
      e: `to polygon :size [:sides 4]
  repeat :sides [forward :size right 360 / :sides]
end
to total [:numbers]
  output reduce "sum fput 0 :numbers
end
polygon 80
(polygon 60 6)
print (total 1 2 3 4)`, see: ['to', 'output', 'stop', 'end'] },

    { n: 'Variables and scope', g: 'Topics', topic: true,
      d: `<p>A variable is a name with a value. <code>make "score 10</code> stores 10 under <code>score</code>; <code>:score</code> gets it back. Notice the quote in <code>MAKE</code> (you are naming the variable) and the colon when you use it (you want its value).</p><p><b>Global variables</b> are made by <code>MAKE</code> outside any procedure, or inside one when the name is not local. They last until the program is run again.</p><p><b>Local variables.</b> A procedure's inputs are local to it. So are names listed with <code>LOCAL</code>, or made with <code>LOCALMAKE</code>. When the procedure ends they disappear, and any global variable with the same name comes back untouched.</p><p><b>Dynamic scope.</b> In Logo a procedure can see the local variables of the procedure that called it, and of that one's caller, and so on. In the example, <code>INNER</code> has no variable called <code>x</code>, but it can use the one belonging to <code>OUTER</code>, because <code>OUTER</code> is still running. Most other languages do not work this way. It is convenient, but it also means a helper procedure can change its caller's variables by accident; use <code>LOCAL</code> in procedures that use <code>MAKE</code> for scratch values.</p>`,
      e: `to outer
  local "x
  make "x 5
  inner
end
to inner
  print :x
end
outer
print namep "x`, see: ['make', 'local', 'localmake', 'thing', 'namep'] },

    { n: 'Recursion', g: 'Topics', topic: true,
      d: `<p>A procedure may use itself. That is called recursion, and it is one of the most natural ways to work in Logo. Every recursive procedure needs two things:</p><ul><li>a <b>stop rule</b> that ends the chain, usually an <code>IF</code> near the top: <code>if :size &lt; 5 [stop]</code>;</li><li>a <b>smaller step</b>: each call works on a smaller size, a shorter list or a lower level, so the stop rule is reached eventually.</li></ul><p>Without a stop rule the procedure calls itself forever and you get <i>Stack overflow</i> (or, if the call is the very last thing it does, a program that never ends; press Stop).</p><p>The tree below is the classic example: each branch is a trunk with two smaller trees on top. Put a breakpoint inside it and open the Call Stack to watch the copies of <code>TREE</code> waiting inside one another.</p>`,
      e: `to tree :size
  if :size < 8 [stop]
  forward :size
  left 25 tree :size * 0.7
  right 50 tree :size * 0.7
  left 25 back :size
end
penup back 150 pendown
tree 100`, see: ['stop', 'output', 'if'] },

    { n: 'Templates', g: 'Topics', topic: true,
      d: `<p>Commands like <code>MAP</code>, <code>FILTER</code>, <code>FOREACH</code>, <code>REDUCE</code> and <code>APPLY</code> take a <i>template</i>: a list of instructions with holes in it, filled in each time with a different value.</p><ul><li><b>Question-mark slots.</b> <code>?</code> stands for the value: <code>map [? * 10] [1 2 3]</code> gives <code>[10 20 30]</code>. When there are several inputs, <code>?1</code> is the first, <code>?2</code> the second, and so on.</li><li><b>Named slots.</b> Start the template with a list of names, and use them as variables: <code>map [[n] :n * 10] [1 2 3]</code>. This is clearer when the template is long, and it works inside other templates without the <code>?</code>s getting mixed up.</li><li><b>A procedure name.</b> A word names a procedure to use: <code>map "first [apple banana]</code> gives <code>[a b]</code>.</li></ul><p>To give a template command more lists than usual, put the call in parentheses: <code>(map [?1 + ?2] [1 2] [10 20])</code>.</p>`,
      e: `show map [? * 10] [1 2 3]
show filter [? > 2] [1 5 2 7]
show (map [[x y] :x * :y] [1 2] [3 4])
foreach [red green blue] [print ?]`, see: ['map', 'filter', 'foreach', 'reduce', 'apply'] },

    { n: 'Infix and precedence', g: 'Topics', topic: true,
      d: `<p>Logo understands arithmetic written the usual way, with <code>+ - * /</code> between numbers, and comparisons <code>= &lt; &gt; &lt;= &gt;= &lt;&gt;</code>. The rules for what goes with what can surprise you.</p><p><b>Times and divide before plus and minus</b>, as in school: <code>2 + 3 * 4</code> is 14.</p><p><b>Infix before inputs.</b> Logo finishes the arithmetic to the right of a procedure name before handing the result over as an input. So <code>sum 3 4 * 2</code> is <code>sum 3 (4 * 2)</code>, which is 11, not 14. Use parentheses when you mean something else: <code>(sum 3 4) * 2</code>.</p><p><b>The IF gotcha.</b> <code>if :x = 1 [...]</code> works as you expect. But <code>if first :list = 1 [...]</code> does not: it means <code>first (:list = 1)</code>, which is the first letter of <code>true</code> or <code>false</code>, and you get <i>if doesn't like f as input</i>. Write <code>if (first :list) = 1 [...]</code> or <code>if equalp first :list 1 [...]</code>.</p><p><b>Minus signs and spaces.</b> Spaces around <code>-</code> matter:</p><table><tr><td><code>3 - 1</code></td><td>subtraction, 2</td></tr><tr><td><code>3-1</code></td><td>also subtraction, 2</td></tr><tr><td><code>:x -1</code></td><td>two separate things: <code>:x</code> and the number -1</td></tr><tr><td><code>-:x</code></td><td>minus the value of x</td></tr></table><p>So <code>print :x -1</code> prints <code>:x</code> and then complains <i>You don't say what to do with -1</i>. Write <code>:x - 1</code> with a space on both sides.</p>`,
      e: `print sum 3 4 * 2
print (sum 3 4) * 2
make "x 5
print :x - 1
print -:x`, see: ['sum', 'difference', 'equalp', 'minus'] },

    { n: 'Colors', g: 'Topics', topic: true,
      d: `<p>Anywhere Lohgo wants a color (<code>SETPENCOLOR</code>, <code>SETBACKGROUND</code>, <code>SETFLOODCOLOR</code>, <code>FILLED</code>, <code>SETTEXTCOLOR</code>) you can give it in any of these ways.</p><p><b>A palette number.</b> These are Berkeley Logo's standard colors:</p><table><tr><td>0 black</td><td>4 red</td><td>8 brown</td><td>12 salmon</td></tr><tr><td>1 blue</td><td>5 magenta</td><td>9 tan</td><td>13 purple</td></tr><tr><td>2 green</td><td>6 yellow</td><td>10 forest</td><td>14 orange</td></tr><tr><td>3 cyan</td><td>7 white</td><td>11 aqua</td><td>15 grey</td></tr></table><p>Numbers 8 to 255 can be given new colors with <code>SETPALETTE</code>.</p><p><b>A mix of red, green and blue</b>, as a list of three numbers from 0 (none) to 255 (full): <code>[255 0 0]</code> is red, <code>[255 255 0]</code> yellow, <code>[128 128 128]</code> grey. This lets you make any color, and change it smoothly in a loop.</p><p><b>A name</b>, such as <code>"red</code>, <code>"skyblue</code>, <code>"gold</code> or <code>"tomato</code>. The sixteen palette names always work, and so do the color names web pages use. <b>A hex code</b> like <code>"#ff8800</code> works too.</p><p><code>PENCOLOR</code> and <code>BACKGROUND</code> output the color the way you gave it.</p>`,
      e: `setpensize 6
for [i 0 15] [setpencolor :i forward 20]
penup home right 90 forward 40 left 90 pendown
for [g 0 255 15] [setpencolor (list 255 :g 0) forward 10]`, see: ['setpencolor', 'setbackground', 'setpalette', 'palette'] },

    { n: 'The turtle world', g: 'Topics', topic: true,
      d: `<p>The turtle world is 800 turtle steps wide and 600 tall. The point (0, 0) is in the middle. x grows to the right and y grows upward, so the corners are (-400, -300) at the bottom left and (400, 300) at the top right.</p><p>Headings are compass directions in degrees: 0 is north (up), 90 east, 180 south, 270 west. <code>RIGHT</code> turns clockwise, so the numbers grow as the turtle turns right.</p><p>What happens at the edge depends on the mode:</p><ul><li><code>WINDOW</code> (the start): the turtle can walk off the edge and keep going. You cannot see it out there, but it can come back.</li><li><code>WRAP</code>: the edges join up, and a turtle leaving on the right comes back on the left.</li><li><code>FENCE</code>: moving past an edge stops the program with <i>Turtle out of bounds</i>.</li></ul><p>Turn on the grid in the turtle world toolbar to see the coordinates; the bottom bar shows where the mouse is. Zooming changes only the view. <code>CLEARSCREEN</code> wipes the drawing and sends the turtle home; <code>CLEAN</code> wipes the drawing only.</p>`,
      e: `penup setxy -400 -300 pendown setxy 400 300
penup setxy -400 300 pendown setxy 400 -300
penup home pendown label [(0, 0)]`, see: ['setxy', 'wrap', 'window', 'fence', 'heading'] },

    { n: 'Keyboard and mouse', g: 'Topics', topic: true,
      d: `<p>There are two ways for a program to listen to you.</p><p><b>Asking and waiting.</b> <code>READLIST</code> and <code>READWORD</code> wait for a line typed in the command center. <code>READCHAR</code> waits for a single key pressed in the turtle world; arrow keys arrive as the words <code>LEFT</code>, <code>RIGHT</code>, <code>UP</code> and <code>DOWN</code>. <code>KEYP</code> says whether a key is waiting, without waiting itself, which is how a game keeps moving while checking for keys.</p><p><b>Events.</b> <code>KEYBOARDON [instructions]</code> runs the instructions every time a key goes down, and <code>KEYBOARDVALUE</code> tells you which (Windows key codes: A is 65, the arrows 37 to 40, space 32, Enter 13). <code>MOUSEON</code> takes five lists for left button down and up, right button down and up, and mouse movement. <code>MOUSEPOS</code>, <code>CLICKPOS</code> and <code>BUTTON</code> report the mouse in turtle coordinates. Event instructions run between the instructions of a running program, or by themselves after it ends; turn them off with <code>KEYBOARDOFF</code> and <code>MOUSEOFF</code>.</p><p>The turtle world only hears keys when it has the keyboard focus: click it first.</p>`,
      e: `keyboardon [if keyboardvalue = 37 [left 15] if keyboardvalue = 39 [right 15] if keyboardvalue = 38 [forward 10]]
print [Click the turtle world and steer with the arrow keys. Type keyboardoff to stop.]`, see: ['readchar', 'keyp', 'keyboardon', 'mouseon', 'mousepos'] },

    { n: 'Files on the virtual disk', g: 'Topics', topic: true,
      d: `<p>A web page cannot freely use the files on your computer, so Lohgo keeps its own <b>virtual disk</b> inside the browser. Your programs and data are saved there and are still there next time you open Lohgo on the same browser. The Files panel lets you browse it, bring files in from your computer and download them.</p><p>In browsers that allow it, the Files panel can also lend Lohgo a real folder from your computer. It appears as <code>/mnt/</code> followed by the folder's name, and you choose whether programs may only read it, must ask before each change, or may write freely.</p><p>Paths use forward slashes, starting from <code>/</code>. Your own work goes in <code>/projects</code>, for example <code>/projects/notes.txt</code>. The examples that come with Lohgo are originals: you can read them, and saving one makes your own copy. A name that does not start with <code>/</code> is looked up in the current folder (<code>CHDIR</code>) or under the prefix (<code>SETPREFIX</code>).</p><p>Writing a file takes four steps: open it, make it the writer, print into it, then put things back and close it. Reading is the same with <code>OPENREAD</code>, <code>SETREAD</code> and <code>READLIST</code>, and <code>EOFP</code> tells you when you have reached the end.</p><p>Instead of a file name you can give a list holding one word. <code>openread [|some text|]</code> reads from that text, and <code>openwrite [result]</code> collects what you print into the variable <code>result</code> when you close it.</p>`,
      e: `openwrite "/projects/shopping.txt
setwrite "/projects/shopping.txt
print [apples] print [bread] print [milk]
setwrite [] close "/projects/shopping.txt
openread "/projects/shopping.txt
setread "/projects/shopping.txt
while [not eofp] [print readlist]
setread [] close "/projects/shopping.txt`, see: ['openread', 'openwrite', 'setread', 'setwrite', 'close', 'files'] },

    { n: 'The debugger', g: 'Topics', topic: true,
      d: `<p>The debugger lets you stop a program in the middle and look inside it.</p><p><b>Breakpoints.</b> Click in the margin next to a line in the editor (or press F9) to put a red dot there. When you run with F5 the program pauses just before that line. Right-click the margin for more: <b>Stop only when...</b> makes a conditional breakpoint such as <code>:n = 3</code>, and <b>Run to here</b> runs up to that line once.</p><p><b>Stepping.</b> While paused:</p><table><tr><td>F5</td><td>continue</td></tr><tr><td>F11 (or F8)</td><td>step into: run one instruction, going inside procedures</td></tr><tr><td>F10</td><td>step over: run one line, without stopping inside procedures it calls</td></tr><tr><td>Shift+F11</td><td>step out: finish the current procedure</td></tr><tr><td>Shift+F5</td><td>stop</td></tr></table><p><b>Call Stack</b> lists the procedures that are running, newest at the top. Click an older one to see its own variables. In a recursive procedure you can see each copy waiting for the one it called.</p><p><b>Variables</b> shows the values in the selected procedure and the global ones. Click a value to change it, then continue: a quick way to test an idea. Lists and arrays unfold so you can see inside them.</p><p><b>Watch</b> keeps an eye on an expression such as <code>:size * 2</code>. It can also stop the program when the value changes, or when it becomes true.</p><p>While paused you can type instructions in the command center; they run inside the selected procedure, so <code>print :size</code> shows its local value. After an error the program's state is kept, so you can look around in the same way.</p>`,
      e: `to countdown :n
  if :n = 0 [print "Liftoff! stop]
  print :n
  countdown :n - 1
end
countdown 5`, see: ['Errors and what they mean', 'Recursion'] },

    { n: 'Errors and what they mean', g: 'Topics', topic: true,
      d: `<p>When something goes wrong Logo stops and says what it did not understand. The messages follow Berkeley Logo. Here are the common ones.</p><table>
<tr><td><b>I don't know how to foo</b></td><td>There is no procedure called <code>foo</code>. Check the spelling, define it with <code>TO</code>, or put a quote in front if you meant the word itself: <code>"foo</code>.</td></tr>
<tr><td><b>Not enough inputs to forward</b></td><td>Something is missing, as in <code>forward</code> on its own. Count the inputs the procedure needs.</td></tr>
<tr><td><b>forward doesn't like abc as input</b></td><td>The input is the wrong kind: a word where a number was needed, an empty list given to <code>FIRST</code>, or an item number past the end of a list.</td></tr>
<tr><td><b>You don't say what to do with 7</b></td><td>A value was made but nothing used it. Did you forget <code>PRINT</code> or <code>OUTPUT</code>? A loose minus sign (<code>:x -1</code>) also causes this.</td></tr>
<tr><td><b>size has no value</b></td><td>There is no variable called <code>size</code> here. Use <code>MAKE</code> first, check the spelling after the colon, or check that the procedure has that input.</td></tr>
<tr><td><b>f didn't output to print</b></td><td><code>PRINT</code> wanted a value but the procedure <code>F</code> ended without <code>OUTPUT</code>. Make sure every way through it outputs something.</td></tr>
<tr><td><b>Too much inside ()'s</b></td><td>There are more inputs inside parentheses than the procedure takes.</td></tr>
<tr><td><b>')' not found</b>, <b>Unexpected ']'</b></td><td>Brackets or parentheses do not pair up. Count the opening and closing ones.</td></tr>
<tr><td><b>Can only use STOP or OUTPUT inside a procedure</b></td><td>These end a procedure, so they only make sense between <code>TO</code> and <code>END</code>.</td></tr>
<tr><td><b>Stack overflow</b></td><td>A procedure called itself too many times, usually because its stop rule is missing or never true.</td></tr>
<tr><td><b>Turtle out of bounds</b></td><td>In <code>FENCE</code> mode the turtle tried to leave the world.</td></tr>
<tr><td><b>forward is a primitive</b></td><td>You tried to define a procedure with the same name as a built-in one. Choose another name.</td></tr>
<tr><td><b>Can't find catch tag for foo</b></td><td><code>THROW "foo</code> ran without a matching <code>CATCH "foo</code> around it.</td></tr>
<tr><td><b>File system error: ...</b></td><td>A file could not be opened, read or written: it does not exist, is not open, or is in a folder you cannot change.</td></tr>
</table><p>Double-click the file and line number under the error to jump to that line. The debugger shows the state of the program when it stopped. To handle an error in your own program instead of stopping, use <code>CATCH "error [...]</code> and <code>ERROR</code>.</p>`,
      e: `catch "error [print first []]
show error`, see: ['catch', 'error', 'The debugger'] },

    { n: 'Differences from Berkeley Logo', g: 'Topics', topic: true,
      d: `<p>Lohgo follows Berkeley Logo (UCBLogo) closely: the same primitives, the same rules for parsing, the same error messages, and programs from <i>Computer Science Logo Style</i> should run unchanged. It adds some things and leaves a few out.</p><p><b>Added from FMSLogo and MSWLogo:</b></p><ul><li>colors as names (<code>"skyblue</code>), hex codes and <code>[r g b]</code> lists everywhere, and <code>SETPALETTE</code> for numbers 8 to 255;</li><li><code>ARC</code>, <code>ELLIPSE</code>, <code>ELLIPSEARC</code>, <code>FILLED</code>, <code>(FILL "true)</code>, <code>SETFLOODCOLOR</code>, <code>SETLABELHEIGHT</code>, <code>STAMP</code> and turtle shapes;</li><li>events: <code>MOUSEON</code>, <code>KEYBOARDON</code>, <code>KEYBOARDVALUE</code>, <code>SETTIMER</code>, <code>CLEARTIMER</code>;</li><li><code>SOUND</code>, <code>TONE</code>, <code>TIME</code>, <code>TIMEMILLI</code>;</li><li>folders: <code>DIRECTORY</code>, <code>FILES</code>, <code>FOLDERS</code>, <code>CHDIR</code>, <code>POPDIR</code>, <code>MKDIR</code>, <code>RMDIR</code>, <code>CURRENTDIR</code> (note that Berkeley Logo's own <code>DIRECTORY</code> behaves differently).</li></ul><p><b>Added from LCSI Logo:</b> several turtles with <code>TELL</code>, <code>ASK</code>, <code>EACH</code> and <code>WHO</code>, alongside FMSLogo's <code>SETTURTLE</code>.</p><p><b>Different because it runs in a browser:</b></p><ul><li>Files live on a virtual disk inside the browser, with paths like <code>/projects/notes.txt</code>. Real DOS or Unix paths such as <code>C:\\logo</code> or <code>~/logo</code> do not exist; a real folder can only be reached by lending it to Lohgo from the Files panel, after which it appears under <code>/mnt</code>.</li><li><code>SHELL</code> cannot run system commands and always gives an error.</li><li><code>EPSPICT</code> is not available; <code>SAVEPICT</code> saves a PNG instead, and <code>LOADPICT</code> loads one.</li><li><code>SETCURSOR</code> and <code>CURSOR</code> are only approximate, because the command center is a scrolling list rather than a fixed text grid. <code>SETMARGINS</code>, <code>SETPENPATTERN</code> and <code>REFRESH</code> are accepted but have no visible effect.</li><li>The turtle world is always 800 by 600 steps, and the turtle animates at the speed set by the speed slider.</li></ul>`,
      see: ['Files on the virtual disk', 'Colors', 'tell', 'mouseon'] },
  ]);
})(LG);

// ==== logo/help/10-data.js ====
(function (LG) {
  'use strict';
  LG.HELP_ENTRIES = (LG.HELP_ENTRIES || []).concat([
    // ---- Building words and lists ------------------------------------------------------------
    {
      n: 'word', a: [], g: 'Building words and lists',
      s: 'WORD word1 word2\n(WORD word1 word2 word3 ...)',
      d: '<p>Outputs a single word made by gluing its inputs together, with no spaces between them. Numbers count as words, so <code>word 1 2</code> outputs the word <code>12</code>.</p>' +
        '<p>Normally WORD takes two inputs. Put the whole call in parentheses to give it any other number, including none: <code>(word)</code> outputs the empty word.</p>' +
        '<p>Every input must be a word. Giving it a list or an array stops with an error such as <code>word doesn\'t like [b] as input</code>.</p>',
      e: 'print word "sun "flower\nprint (word "a "b "c 123)',
      see: ['sentence', 'list', 'combine']
    },
    {
      n: 'list', a: [], g: 'Building words and lists',
      s: 'LIST thing1 thing2\n(LIST thing1 thing2 thing3 ...)',
      d: '<p>Outputs a list whose members are its inputs, in order. Each input becomes exactly one member, so a list input stays a list inside the result: <code>list [a b] "c</code> outputs <code>[[a b] c]</code>.</p>' +
        '<p>Two inputs are the default. Use parentheses for any other number; <code>(list)</code> outputs the empty list <code>[]</code>. Inputs can be words, lists or arrays.</p>',
      e: 'show list "apple [banana cherry]\nshow (list 1 2 3 4)',
      see: ['sentence', 'fput', 'lput']
    },
    {
      n: 'sentence', a: ['se'], g: 'Building words and lists',
      s: 'SENTENCE thing1 thing2\n(SENTENCE thing1 thing2 thing3 ...)',
      d: '<p>Outputs a list made from its inputs. A word input becomes one member of the result. A list input has its members spliced in, one level deep only, so a list inside a list stays a list.</p>' +
        '<p>For example <code>sentence [a [b]] "c</code> outputs <code>[a [b] c]</code>. Compare LIST, which would give <code>[[a [b]] c]</code>.</p>' +
        '<p>Two inputs are the default; use parentheses for more or fewer. Arrays are not accepted and give an error such as <code>sentence doesn\'t like {a b} as input</code>.</p>',
      e: 'show sentence [the quick] [brown fox]\nshow (se "one [two three] [[four]])',
      see: ['list', 'word', 'fput']
    },
    {
      n: 'fput', a: [], g: 'Building words and lists',
      s: 'FPUT thing list',
      d: '<p>Outputs a new list with <code>thing</code> added at the front of <code>list</code>. The original list is not changed. This is the fastest way to grow a list, because nothing has to be copied.</p>' +
        '<p>If the second input is a word, the first input must be a single character, and FPUT outputs a word with that character in front: <code>fput "c "at</code> outputs <code>cat</code>. Anything else (for example a two-letter first input with a word, or an array as the second input) gives an error like <code>fput doesn\'t like cd as input</code>.</p>',
      e: 'show fput "red [green blue]\nshow fput "c "at',
      see: ['lput', 'combine', 'butfirst']
    },
    {
      n: 'lput', a: [], g: 'Building words and lists',
      s: 'LPUT thing list',
      d: '<p>Outputs a new list with <code>thing</code> added at the end of <code>list</code>. The original list is not changed. LPUT has to copy the whole list, so for very long lists FPUT is quicker.</p>' +
        '<p>If the second input is a word, the first must be a single character and LPUT outputs a word: <code>lput "s "cat</code> outputs <code>cats</code>. Other combinations give a <code>doesn\'t like</code> error.</p>',
      e: 'show lput "blue [red green]\nshow lput "s "cat',
      see: ['fput', 'butlast', 'last']
    },
    {
      n: 'combine', a: [], g: 'Building words and lists',
      s: 'COMBINE thing1 thing2',
      d: '<p>Joins two things in whichever way makes sense. If the second input is a list, COMBINE acts like FPUT and puts the first input at the front of it. Otherwise both inputs must be words and COMBINE acts like WORD.</p>' +
        '<p>So <code>combine "a [b c]</code> outputs <code>[a b c]</code> and <code>combine "a "b</code> outputs <code>ab</code>. A list as the first input with a word as the second is an error.</p>',
      e: 'show combine "a [b c]\nshow combine "snow "man',
      see: ['fput', 'word']
    },
    {
      n: 'reverse', a: [], g: 'Building words and lists',
      s: 'REVERSE thing',
      d: '<p>Outputs a list with the members of the input in the opposite order, or a word with its characters in the opposite order. Only the top level is reversed: lists inside the list keep their own order.</p>' +
        '<p>Arrays are not accepted and give a <code>doesn\'t like</code> error.</p>',
      e: 'show reverse [1 2 3 4]\nprint reverse "stressed',
      see: ['first', 'last']
    },
    {
      n: 'gensym', a: [], g: 'Building words and lists',
      s: 'GENSYM',
      d: '<p>Outputs a new word each time it is called: <code>g1</code>, then <code>g2</code>, then <code>g3</code>, and so on. It is handy when a program needs to invent names, for example for variables or property lists, that will not clash with each other.</p>' +
        '<p>The counter keeps going for as long as the page is open.</p>',
      e: 'print gensym\nprint gensym',
      see: ['word', 'make']
    },

    // ---- Taking things apart -----------------------------------------------------------------
    {
      n: 'first', a: [], g: 'Taking words and lists apart',
      s: 'FIRST thing',
      d: '<p>Outputs the first member of a list, or the first character of a word. <code>first [apple banana]</code> is <code>apple</code> and <code>first "hello</code> is <code>h</code>. A number is a word, so <code>first 123</code> is <code>1</code>.</p>' +
        '<p>Given an array, FIRST does something different: it outputs the array\'s origin, the index of its first slot (usually 1). Use ITEM to read what is stored in an array.</p>' +
        '<p>The empty list <code>[]</code> and the empty word have no first member, so they give an error like <code>first doesn\'t like [] as input</code>.</p>',
      e: 'print first [apple banana cherry]\nprint first "hello\nprint first (listtoarray [a b c] 0)',
      see: ['butfirst', 'last', 'item', 'firsts']
    },
    {
      n: 'firsts', a: [], g: 'Taking words and lists apart',
      s: 'FIRSTS list',
      d: '<p>Takes a list whose members are all lists or words, and outputs a list of the FIRST of each one. <code>firsts [[a b] [c d] ef]</code> outputs <code>[a c e]</code>.</p>' +
        '<p>The input must be a list, and none of its members may be empty; otherwise you get an error like <code>firsts doesn\'t like ... as input</code>.</p>',
      e: 'show firsts [[1 2 3] [4 5 6] [7 8 9]]',
      see: ['first', 'butfirsts']
    },
    {
      n: 'last', a: [], g: 'Taking words and lists apart',
      s: 'LAST thing',
      d: '<p>Outputs the last member of a list, or the last character of a word. <code>last [a b c]</code> is <code>c</code> and <code>last "hello</code> is <code>o</code>.</p>' +
        '<p>An empty list or empty word gives an error like <code>last doesn\'t like [] as input</code>. Arrays are not accepted.</p>',
      e: 'print last [apple banana cherry]\nprint last "hello',
      see: ['first', 'butlast']
    },
    {
      n: 'butfirst', a: ['bf'], g: 'Taking words and lists apart',
      s: 'BUTFIRST thing\nBF thing',
      d: '<p>Outputs everything except the first member of a list, or everything except the first character of a word. <code>bf [a b c]</code> is <code>[b c]</code> and <code>bf "hello</code> is <code>ello</code>. A one-member list gives <code>[]</code>; a one-character word gives the empty word.</p>' +
        '<p>FIRST and BUTFIRST together are the usual way to walk through a list one member at a time in a recursive procedure.</p>' +
        '<p>An empty list or word gives an error like <code>butfirst doesn\'t like [] as input</code>. Arrays are not accepted.</p>',
      e: 'show butfirst [apple banana cherry]\nprint bf "hello',
      see: ['first', 'butlast', 'butfirsts']
    },
    {
      n: 'butfirsts', a: ['bfs'], g: 'Taking words and lists apart',
      s: 'BUTFIRSTS list\nBFS list',

// ==== logo/help/40-workspace.js ====
(function (LG) {
  'use strict';
  LG.HELP_ENTRIES = (LG.HELP_ENTRIES || []).concat([

    // ---- Defining procedures -------------------------------------------------------------------
    { n: 'to', a: [], g: 'Defining procedures', s: 'TO procname :input1 :input2 ...',
      d: '<p>Starts the definition of a new procedure. The title line gives its name and the names of its inputs, each written with a colon. The lines after it are the body, and a line with just END finishes it. You type TO in the editor, or in the command center, which then lets you type the rest of the lines.</p><p>The title line can also hold extra kinds of inputs:</p><ul><li><code>[:size 50]</code> is an optional input with a default value (the default can be an expression)</li><li><code>[:rest]</code> collects any further inputs into a list</li><li>a number at the end says how many inputs to take when there are no parentheses</li></ul><p>TO cannot be run from inside a list or a procedure; that gives "Can\'t use TO inside a procedure". Defining a procedure with the name of a primitive is an error unless the variable <code>redefp</code> is <code>true</code>.</p>',
      e: 'to square :size\nrepeat 4 [forward :size right 90]\nend\nsquare 80', see: ['end', 'define', 'output', '.macro'] },
    { n: 'end', a: [], g: 'Defining procedures', s: 'END',

    { n: 'define', a: [], g: 'Defining procedures', s: 'DEFINE name text',

      e: 'define "double [[n] [output :n * 2]]\nprint double 21', see: ['text', 'to', 'copydef'] },
    { n: 'text', a: [], g: 'Defining procedures', s: 'TEXT procname',

      e: 'to greet :who\nprint sentence "hello :who\nend\nshow text "greet', see: ['fulltext', 'define', 'printout'] },
    { n: 'fulltext', a: [], g: 'Defining procedures', s: 'FULLTEXT procname',

    { n: 'name', a: [], g: 'Variables', s: 'NAME value varname',

    { n: 'traced', a: [], g: 'Looking at the workspace', s: 'TRACED',

    { n: 'stepped', a: [], g: 'Looking at the workspace', s: 'STEPPED',

    { n: 'names', a: [], g: 'Looking at the workspace', s: 'NAMES',

    { n: 'arity', a: [], g: 'Looking at the workspace', s: 'ARITY procname',

    // ---- Printing ----------------------------------------------------------------------------
    { n: 'print', a: ['pr'], g: 'Printing', s: 'PRINT thing; (PRINT thing1 thing2 ...)',
      d: `<p>Writes its input in the command center and then starts a new line. A list is printed without its outer brackets, so <code>print [Hello there]</code> shows <code>Hello there</code>. With parentheses it prints several things on one line, separated by spaces.</p><p>If <code>SETWRITE</code> has chosen a file, the text goes into the file instead.</p>`,

    // ---- Reading the keyboard ----------------------------------------------------------------
    { n: 'readlist', a: ['rl'], g: 'Reading the keyboard', s: 'READLIST',

      e: `print [What is your name?] make "name readlist print sentence [Hello,] :name`, see: ['readword', 'readchar', 'setread'] },
    { n: 'readword', a: ['rw'], g: 'Reading the keyboard', s: 'READWORD',
      d: `<p>Waits for a line typed in the command center and outputs it as a single word, spaces and all. Use it when you want a number or one answer. From a file (see <code>SETREAD</code>) it reads the next line, and outputs the empty list at the end of the file.</p>`,

    { n: 'readchar', a: ['rc'], g: 'Reading the keyboard', s: 'READCHAR',

      e: `mkdir "/projects/old rmdir "/projects/old chdir "/projects show folders popdir`, see: ['mkdir'] },

    // ---- The text window -----------------------------------------------------------------------
    { n: 'cleartext', a: ['ct'], g: 'The text window', s: 'CLEARTEXT',
      d: `<p>Wipes everything written in the command center.</p>`,
      e: `print [You will not see this for long.] cleartext print [Clean slate.]`, see: ['print'] },
    { n: 'setcursor', a: [], g: 'The text window', s: 'SETCURSOR [column row]',
      d: `<p>In a text screen this moves the place where printing happens. The command center is a scrolling list of lines, not a grid, so in Lohgo it is only approximate: <code>setcursor [0 0]</code> clears the command center, and other positions are remembered for <code>CURSOR</code> but do not move the text.</p>`,
      e: `setcursor [0 0] print [Back at the top.] show cursor`, see: ['cursor', 'cleartext'] },
    { n: 'cursor', a: [], g: 'The text window', s: 'CURSOR',
      d: `<p>Outputs the position last set with <code>SETCURSOR</code>, as <code>[column row]</code>.</p>`,
      e: `show cursor`, see: ['setcursor'] },
    { n: 'setmargins', a: [], g: 'The text window', s: 'SETMARGINS [x y]',
      d: `<p>Accepted for Berkeley Logo programs; it has no effect in Lohgo.</p>`,
      e: `setmargins [0 0] print [Nothing changed: SETMARGINS has no effect in Lohgo.]`, see: ['setcursor'] },
    { n: 'settextcolor', a: [], g: 'The text window', s: 'SETTEXTCOLOR color background; (SETTEXTCOLOR color)',
      d: `<p>Sets the color of the text that is printed after it in the command center. It takes the same kinds of colors as <code>SETPENCOLOR</code>. Like FMSLogo it expects two inputs, the text color and a background color, but Lohgo does not use the background, so you can give just one inside parentheses.</p>`,
      e: `(settextcolor "red) print [Warning!] (settextcolor "black) print [All clear.]`, see: ['setpencolor'] },
    { n: 'increasefont', a: [], g: 'The text window', s: 'INCREASEFONT',
      d: `<p>Makes the command center text 2 pixels bigger.</p>`,
      e: `increasefont print textsize decreasefont`, see: ['decreasefont', 'settextsize'] },
    { n: 'decreasefont', a: [], g: 'The text window', s: 'DECREASEFONT',
      d: `<p>Makes the command center text 2 pixels smaller, down to 8.</p>`,
      e: `decreasefont print textsize increasefont`, see: ['increasefont'] },
    { n: 'settextsize', a: [], g: 'The text window', s: 'SETTEXTSIZE size',
      d: `<p>Sets the size of the command center text in pixels. It starts at 14.</p>`,
      e: `settextsize 20 print [Bigger] settextsize 14`, see: ['textsize'] },
    { n: 'textsize', a: [], g: 'The text window', s: 'TEXTSIZE',
      d: `<p>Outputs the size of the command center text in pixels.</p>`,
      e: `print textsize`, see: ['settextsize'] },
    { n: 'setfont', a: [], g: 'The text window', s: 'SETFONT name',
      d: `<p>Sets the typeface of the command center text, for example <code>"serif</code> or <code>"monospace</code>. To change the font of turtle labels, use <code>SETLABELFONT</code>.</p>`,
      e: `setfont "serif print [A different font] setfont "monospace`, see: ['font', 'setlabelfont'] },
    { n: 'font', a: [], g: 'The text window', s: 'FONT',
      d: `<p>Outputs the name of the command center font.</p>`,
      e: `print font`, see: ['setfont'] },
    { n: 'textscreen', a: ['ts'], g: 'The text window', s: 'TEXTSCREEN',
      d: `<p>Gives the screen to text. On a phone it switches to the command center; on a larger screen it ends <code>FULLSCREEN</code>, so the command center is visible.</p>`,
      e: `textscreen print screenmode`, see: ['splitscreen', 'fullscreen', 'screenmode'] },
    { n: 'fullscreen', a: ['fs'], g: 'The text window', s: 'FULLSCREEN',
      d: `<p>Makes the turtle world as big as possible, covering the editor and command center. <code>SPLITSCREEN</code> brings them back.</p>`,
      e: `fullscreen repeat 36 [forward 150 back 150 right 10] wait 60 splitscreen`, see: ['splitscreen', 'textscreen'] },
    { n: 'splitscreen', a: ['ss'], g: 'The text window', s: 'SPLITSCREEN',
      d: `<p>Shows the turtle world and the command center side by side, the normal layout.</p>`,
      e: `splitscreen print screenmode`, see: ['fullscreen', 'textscreen'] },
    { n: 'shell', a: [], g: 'The text window', s: 'SHELL command; (SHELL command wordflag)',
      d: `<p>In Berkeley Logo this runs a command of the computer's operating system. A web page is not allowed to do that, so in Lohgo <code>SHELL</code> always stops with the error <code>SHELL is not available in the browser</code>.</p>`,
      see: ['directory', 'files'] },

    // ---- Sound and time ------------------------------------------------------------------------
    { n: 'sound', a: [], g: 'Sound and time', s: 'SOUND [frequency duration frequency duration ...]',
      d: `<p>Plays a tune of beeps. The list holds pairs of numbers: a frequency in hertz (440 is the A above middle C; bigger is higher) and how long to play it in milliseconds. The program waits until the tune has finished.</p>`,
      e: `sound [262 200 330 200 392 200 523 400]`, see: ['tone'] },
    { n: 'tone', a: [], g: 'Sound and time', s: 'TONE frequency duration',
      d: `<p>Plays one beep of <code>frequency</code> hertz for <code>duration</code> milliseconds and waits for it to finish.</p>`,
      e: `repeat 3 [tone 440 150 tone 660 150]`, see: ['sound', 'wait'] },
    { n: 'time', a: [], g: 'Sound and time', s: 'TIME',
      d: `<p>Outputs the date and time as a list, for example <code>[Thu Oct 15 06:28:20 2026]</code>: day, month, date, time and year. <code>item 4 time</code> is the time on its own.</p>`,
      e: `show time print item 4 time`, see: ['timemilli'] },
    { n: 'timemilli', a: [], g: 'Sound and time', s: 'TIMEMILLI',
      d: `<p>Outputs the number of milliseconds since Lohgo started. Take it before and after something to see how long it took.</p>`,
      e: `make "start timemilli repeat 360 [forward 1 right 1] print timemilli - :start`, see: ['time', 'wait'] },
  ]);
})(LG);

// ==== logo/help/60-turtle.js ====
// Language reference: turtle graphics (group "turtle" in tools/primitives.json).
(function (LG) {
  'use strict';
  LG.HELP_ENTRIES = (LG.HELP_ENTRIES || []).concat([

    // ---- Turtle motion -----------------------------------------------------------------------
    { n: 'forward', a: ['fd'], g: 'Turtle motion', s: 'FORWARD distance',
      d: `<p>Moves the turtle <code>distance</code> steps in the direction it is facing. If the pen is down, it draws a line as it goes. A negative distance moves it backward.</p><p>The turtle world is 800 steps wide and 600 steps tall, so <code>forward 100</code> is one eighth of the width. How fast the turtle walks depends on the speed slider; at <b>Instant</b> the line appears at once.</p>`,
      e: `repeat 4 [forward 100 right 90]`, see: ['back', 'right', 'left', 'setpos'] },
    { n: 'back', a: ['bk'], g: 'Turtle motion', s: 'BACK distance',
      d: `<p>Moves the turtle <code>distance</code> steps backward, the opposite way to where it is facing. It does not turn around: its heading stays the same. <code>back 50</code> is the same as <code>forward -50</code>.</p>`,
      e: `forward 100 back 50 right 90 forward 50`, see: ['forward'] },
    { n: 'right', a: ['rt'], g: 'Turtle motion', s: 'RIGHT degrees',
      d: `<p>Turns the turtle clockwise by <code>degrees</code> without moving it. A full turn is 360 degrees, so <code>right 90</code> is a quarter turn. A negative number turns the other way.</p>`,
      e: `repeat 6 [forward 80 right 60]`, see: ['left', 'setheading', 'heading'] },
    { n: 'left', a: ['lt'], g: 'Turtle motion', s: 'LEFT degrees',
      d: `<p>Turns the turtle counterclockwise by <code>degrees</code> without moving it. <code>left 90</code> is the same as <code>right -90</code>.</p>`,
      e: `repeat 5 [forward 100 left 144]`, see: ['right', 'setheading'] },
    { n: 'setpos', a: [], g: 'Turtle motion', s: 'SETPOS [x y]',
      d: `<p>Moves the turtle straight to the point <code>[x y]</code>, drawing a line if the pen is down. The heading does not change. The input must be a list of two numbers; <code>(0, 0)</code> is the middle of the world and y grows upward.</p>`,
      e: `setpos [100 100] setpos [100 -100] setpos [0 0]`, see: ['setxy', 'pos', 'home'] },
    { n: 'setxy', a: [], g: 'Turtle motion', s: 'SETXY x y',
      d: `<p>Moves the turtle to the point (x, y), drawing a line if the pen is down. Like <code>SETPOS</code>, but takes the two numbers as separate inputs, which is handy when they are worked out: <code>setxy :x * 2 :y</code>.</p>`,
      e: `penup setxy -200 0 pendown setxy 200 0`, see: ['setpos', 'setx', 'sety'] },
    { n: 'setx', a: [], g: 'Turtle motion', s: 'SETX x',
      d: `<p>Moves the turtle sideways (or not at all) so that its x coordinate becomes <code>x</code>. Its y coordinate and heading stay the same.</p>`,
      e: `setx 150 sety 100 setx 0`, see: ['sety', 'setxy', 'xcor'] },
    { n: 'sety', a: [], g: 'Turtle motion', s: 'SETY y',
      d: `<p>Moves the turtle up or down so that its y coordinate becomes <code>y</code>. Its x coordinate and heading stay the same.</p>`,
      e: `sety 150 setx 100 sety 0`, see: ['setx', 'setxy', 'ycor'] },
    { n: 'setheading', a: ['seth'], g: 'Turtle motion', s: 'SETHEADING degrees',
      d: `<p>Turns the turtle to face an exact direction. 0 is north (up the screen), 90 is east, 180 is south and 270 is west. Unlike <code>RIGHT</code>, the turn does not depend on where the turtle was facing before.</p>`,
      e: `setheading 45 forward 100 setheading 180 forward 50`, see: ['heading', 'right', 'towards'] },
    { n: 'home', a: [], g: 'Turtle motion', s: 'HOME',
      d: `<p>Moves the turtle back to the middle of the world, (0, 0), and turns it to face north. If the pen is down it draws a line on the way.</p>`,
      e: `forward 100 right 90 forward 100 home`, see: ['clearscreen', 'setpos'] },
    { n: 'arc', a: [], g: 'Turtle motion', s: 'ARC angle radius',
      d: `<p>Draws part of a circle centered on the turtle. The arc starts at the point straight ahead of the turtle, <code>radius</code> steps away, and sweeps clockwise for <code>angle</code> degrees (counterclockwise if the angle is negative). <code>arc 360 50</code> draws a whole circle.</p><p>The turtle does not move or turn. Nothing is drawn while the pen is up.</p>`,
      e: `arc 360 100 arc 90 60 right 180 arc 90 60`, see: ['ellipse', 'ellipsearc'] },
    { n: 'ellipse', a: [], g: 'Turtle motion', s: 'ELLIPSE width height',
      d: `<p>Draws an oval centered on the turtle, as in FMSLogo. <code>width</code> is the size across the turtle (left to right as it faces) and <code>height</code> is the size along its heading, so turning the turtle tilts the oval. The turtle does not move. If the two numbers are equal you get a circle.</p>`,
      e: `ellipse 200 100 right 45 ellipse 200 100`, see: ['arc', 'ellipsearc'] },
    { n: 'ellipsearc', a: [], g: 'Turtle motion', s: 'ELLIPSEARC angle width height startangle',
      d: `<p>Draws part of an oval centered on the turtle, FMSLogo style: <code>angle</code> degrees of an ellipse <code>width</code> across and <code>height</code> along the turtle's heading. The turtle does not move.</p><p><code>startangle</code> says where on the oval the arc begins, in degrees measured the same way as <code>angle</code>, so <code>ellipsearc 90 200 100 90</code> draws the second quarter.</p>`,
      e: `ellipsearc 90 200 100 0 ellipsearc 90 120 60 180`, see: ['ellipse', 'arc'] },
    { n: 'dot', a: [], g: 'Turtle motion', s: 'DOT [x y]',
      d: `<p>Paints one small dot in the pen color at the point <code>[x y]</code>. The turtle stays where it is, and the dot is drawn even when the pen is up. A bigger pen size makes a bigger dot.</p>`,
      e: `setpensize 6 repeat 20 [dot list (random 400) - 200 (random 300) - 150]`, see: ['setpensize', 'setpos'] },

    // ---- Where the turtle is -----------------------------------------------------------------
    { n: 'pos', a: [], g: 'Where the turtle is', s: 'POS',
      d: `<p>Outputs the turtle's position as a list <code>[x y]</code>. You can save it and go back later with <code>SETPOS</code>.</p>`,
      e: `forward 50 right 90 forward 30 show pos`, see: ['xcor', 'ycor', 'setpos'] },
    { n: 'xcor', a: [], g: 'Where the turtle is', s: 'XCOR',
      d: `<p>Outputs the turtle's x coordinate: how far it is to the right of the middle (negative means to the left).</p>`,
      e: `right 90 forward 75 print xcor`, see: ['ycor', 'pos', 'setx'] },
    { n: 'ycor', a: [], g: 'Where the turtle is', s: 'YCOR',
      d: `<p>Outputs the turtle's y coordinate: how far it is above the middle (negative means below).</p>`,
      e: `forward 40 print ycor`, see: ['xcor', 'pos', 'sety'] },
    { n: 'heading', a: [], g: 'Where the turtle is', s: 'HEADING',
      d: `<p>Outputs the direction the turtle is facing, in degrees from 0 up to (but not including) 360. 0 is north and the numbers grow clockwise.</p>`,
      e: `right 30 right 45 print heading`, see: ['setheading', 'towards'] },
    { n: 'towards', a: [], g: 'Where the turtle is', s: 'TOWARDS [x y]',
      d: `<p>Outputs the heading the turtle would need to face the point <code>[x y]</code>. It does not turn the turtle; use <code>setheading towards [x y]</code> for that.</p>`,
      e: `setheading towards [100 100] print heading forward 141`, see: ['distance', 'setheading'] },
    { n: 'distance', a: [], g: 'Where the turtle is', s: 'DISTANCE [x y]',
      d: `<p>Outputs how many steps it is in a straight line from the turtle to the point <code>[x y]</code>.</p>`,
      e: `print distance [30 40]`, see: ['towards', 'pos'] },
    { n: 'scrunch', a: [], g: 'Where the turtle is', s: 'SCRUNCH',
      d: `<p>Outputs a list of the two scrunch factors <code>[xscale yscale]</code> set by <code>SETSCRUNCH</code>. Both are 1 at the start.</p>`,
      e: `show scrunch`, see: ['setscrunch'] },
    { n: 'setscrunch', a: [], g: 'Where the turtle is', s: 'SETSCRUNCH xscale yscale',
      d: `<p>Stretches the turtle's steps: every move is multiplied by <code>xscale</code> sideways and <code>yscale</code> up and down. <code>setscrunch 2 1</code> makes circles come out as wide ovals. Neither number may be 0. <code>setscrunch 1 1</code> puts things back.</p>`,
      e: `setscrunch 2 1 repeat 36 [forward 10 right 10] setscrunch 1 1`, see: ['scrunch'] },

    // ---- Pen and color ------------------------------------------------------------------------
    { n: 'pendown', a: ['pd'], g: 'Pen and color', s: 'PENDOWN',
      d: `<p>Puts the pen down, so the turtle draws a line wherever it moves. The pen starts down. If the pen was erasing or reversing, it keeps doing that; use <code>PENPAINT</code> to go back to ordinary drawing.</p>`,
      e: `penup forward 50 pendown forward 50`, see: ['penup', 'penpaint', 'pendownp'] },
    { n: 'penup', a: ['pu'], g: 'Pen and color', s: 'PENUP',
      d: `<p>Lifts the pen, so the turtle moves without drawing. Use it to move to a new place before you start a picture.</p>`,
      e: `repeat 10 [forward 10 penup forward 10 pendown]`, see: ['pendown'] },
    { n: 'penpaint', a: ['ppt'], g: 'Pen and color', s: 'PENPAINT',
      d: `<p>Puts the pen down in ordinary drawing mode, in the pen color. This undoes <code>PENERASE</code> and <code>PENREVERSE</code>.</p>`,
      e: `penerase forward 50 penpaint forward 50 print penmode`, see: ['penerase', 'penreverse', 'penmode'] },
    { n: 'penerase', a: ['pe'], g: 'Pen and color', s: 'PENERASE',
      d: `<p>Puts the pen down as an eraser: wherever the turtle goes, it rubs out what was drawn there and the background shows through. Use <code>PENPAINT</code> to draw again.</p>`,
      e: `setpensize 8 forward 100 back 100 setpensize 3 penerase forward 60 penpaint`, see: ['penpaint', 'penreverse'] },
    { n: 'penreverse', a: ['px'], g: 'Pen and color', s: 'PENREVERSE',
      d: `<p>Puts the pen down in reverse mode: where the line crosses empty space it draws, and where it crosses something already drawn it rubs it out. Drawing the same line twice makes it disappear, which is a simple way to animate.</p>`,
      e: `setpensize 6 penreverse print penmode forward 100 back 100 penpaint`, see: ['penpaint', 'penerase'] },
    { n: 'pendownp', a: ['pendown?'], g: 'Pen and color', s: 'PENDOWNP',
      d: `<p>Outputs <code>true</code> if the pen is down and <code>false</code> if it is up.</p>`,
      e: `print pendownp penup print pendownp pendown`, see: ['pendown', 'penup'] },
    { n: 'penmode', a: [], g: 'Pen and color', s: 'PENMODE',
      d: `<p>Outputs the pen's mode: <code>PAINT</code>, <code>ERASE</code> or <code>REVERSE</code>.</p>`,
      e: `print penmode`, see: ['penpaint', 'penerase', 'penreverse'] },
    { n: 'setpencolor', a: ['setpc', 'setcolor'], g: 'Pen and color', s: 'SETPENCOLOR color',
      d: `<p>Sets the color of the lines the turtle draws, and of labels, dots and fills that use the pen color. A color can be:</p><ul><li>a palette number 0 to 15 (0 black, 1 blue, 2 green, 3 cyan, 4 red, 5 magenta, 6 yellow, 7 white, 8 brown, 9 tan, 10 forest, 11 aqua, 12 salmon, 13 purple, 14 orange, 15 grey), or a higher number you set with <code>SETPALETTE</code>;</li><li>a list <code>[red green blue]</code>, each from 0 to 255;</li><li>a color name such as <code>"red</code> or <code>"skyblue</code>, or a word like <code>"#ff8800</code>.</li></ul>`,
      e: `setpensize 4 setpencolor 4 forward 60 setpencolor [0 150 255] right 90 forward 60 setpencolor "orange right 90 forward 60`, see: ['pencolor', 'setbackground', 'setpalette'] },
    { n: 'pencolor', a: ['pc'], g: 'Pen and color', s: 'PENCOLOR',
      d: `<p>Outputs the pen color the way it was set: a number, a list of three numbers, or a color name.</p>`,
      e: `setpencolor [10 120 200] show pencolor`, see: ['setpencolor'] },
    { n: 'setbackground', a: ['setbg', 'setscreencolor', 'setsc'], g: 'Pen and color', s: 'SETBACKGROUND color',
      d: `<p>Sets the color of the whole turtle world behind the drawing. It takes the same kinds of colors as <code>SETPENCOLOR</code>. Lines you have already drawn stay as they are. The background starts white (7).</p>`,
      e: `setbackground [20 20 60] setpencolor "yellow repeat 5 [forward 100 right 144]`, see: ['background', 'setpencolor'] },
    { n: 'background', a: ['bg', 'screencolor'], g: 'Pen and color', s: 'BACKGROUND',
      d: `<p>Outputs the background color. Drawing in this color is a way to paint over lines.</p>`,
      e: `print background`, see: ['setbackground'] },
    { n: 'setfloodcolor', a: ['setfc'], g: 'Pen and color', s: 'SETFLOODCOLOR color',
      d: `<p>Sets the color that <code>FILL</code> pours in, so you can fill with one color while drawing outlines in another. Until you set it, <code>FILL</code> uses the pen color.</p>`,
      e: `repeat 4 [forward 100 right 90] penup setxy 50 50 pendown setfloodcolor "yellow fill`, see: ['fill', 'floodcolor'] },
    { n: 'floodcolor', a: ['fc'], g: 'Pen and color', s: 'FLOODCOLOR',
      d: `<p>Outputs the color <code>FILL</code> will use: the flood color if one was set, otherwise the pen color.</p>`,
      e: `setfloodcolor 14 print floodcolor`, see: ['setfloodcolor'] },
    { n: 'setpalette', a: [], g: 'Pen and color', s: 'SETPALETTE number [red green blue]',
      d: `<p>Gives a palette number its own color, so you can later use the number wherever a color is wanted. Numbers 8 to 255 can be changed; 0 to 7 are fixed. Each of red, green and blue is from 0 to 255.</p>`,
      e: `setpalette 20 [255 105 180] setpensize 5 setpencolor 20 forward 100 show palette 20`, see: ['palette', 'setpencolor'] },
    { n: 'palette', a: [], g: 'Pen and color', s: 'PALETTE number',
      d: `<p>Outputs the <code>[red green blue]</code> list for a palette number from 0 to 255. Numbers that have never been set are black.</p>`,
      e: `show palette 14`, see: ['setpalette'] },
    { n: 'setpensize', a: ['setwidth'], g: 'Pen and color', s: 'SETPENSIZE size',
      d: `<p>Sets how thick the turtle's lines are, in turtle steps. The size starts at 1 and must be more than 0. A list like <code>[5 5]</code> is also accepted, as in Berkeley Logo; only its first number is used.</p>`,
      e: `for [s 1 10] [setpensize :s forward 30 penup back 30 right 90 forward 25 left 90 pendown]`, see: ['pensize'] },
    { n: 'pensize', a: [], g: 'Pen and color', s: 'PENSIZE',
      d: `<p>Outputs the pen size as a list of two equal numbers, <code>[width height]</code>, as Berkeley Logo does.</p>`,
      e: `setpensize 4 show pensize`, see: ['setpensize'] },
    { n: 'setpenpattern', a: [], g: 'Pen and color', s: 'SETPENPATTERN pattern',
      d: `<p>Remembers a pen pattern, for programs written for other Logos. Lohgo stores it so <code>PENPATTERN</code> can give it back, but lines are always drawn solid.</p>`,
      e: `setpenpattern [1 0 1 0] show penpattern`, see: ['penpattern'] },
    { n: 'penpattern', a: [], g: 'Pen and color', s: 'PENPATTERN',
      d: `<p>Outputs the pattern last given to <code>SETPENPATTERN</code>, or the empty list.</p>`,
      e: `show penpattern`, see: ['setpenpattern'] },
    { n: 'pen', a: [], g: 'Pen and color', s: 'PEN',
      d: `<p>Outputs everything about the pen in one list: <code>[pendown paint color [size size] pattern]</code>. Save it in a variable and give it to <code>SETPEN</code> later to put the pen back exactly as it was.</p>`,
      e: `make "saved pen setpencolor 4 setpensize 5 forward 50 setpen :saved forward 50 show pen`, see: ['setpen'] },
    { n: 'setpen', a: [], g: 'Pen and color', s: 'SETPEN list',
      d: `<p>Sets the pen from a list like the one <code>PEN</code> outputs: up or down, mode, color and size.</p>`,
      e: `setpen [pendown paint 4 [6 6]] forward 80`, see: ['pen'] },

    // ---- Filling and labels --------------------------------------------------------------------
    { n: 'fill', a: [], g: 'Filling and labels', s: 'FILL; (FILL true)',
      d: `<p>Pours paint into the area under the turtle, like the paint bucket in a drawing program. The paint spreads over all the touching pixels that are the same color as the one under the turtle, and stops where the color changes. It uses the flood color if you set one with <code>SETFLOODCOLOR</code>, otherwise the pen color.</p><p><code>(FILL "true)</code> instead fills until it reaches lines of the pen color, painting over anything else on the way.</p><p>Move the turtle inside a closed shape first, with the pen up, or the paint will leak out over the whole world.</p>`,
      e: `repeat 3 [forward 150 right 120] penup setxy 40 40 pendown setfloodcolor [120 200 255] fill`, see: ['setfloodcolor', 'filled'] },
    { n: 'filled', a: [], g: 'Filling and labels', s: 'FILLED color [instructions]',
      d: `<p>Runs the instructions, notes every point the turtle walks to, and then fills the shape those points make with <code>color</code>. The fill goes behind the lines, so the outline stays visible. It works even if the shape is not closed and does not depend on what is already on the screen, which makes it more dependable than <code>FILL</code>.</p><p>Only straight moves count: an <code>ARC</code> inside the instructions is drawn but is not part of the filled shape.</p>`,
      e: `filled "orange [repeat 5 [forward 150 right 144]]`, see: ['fill', 'setpencolor'] },
    { n: 'label', a: [], g: 'Filling and labels', s: 'LABEL thing',
      d: `<p>Writes a word, number or list on the drawing at the turtle's position, in the pen color. The text always runs left to right across the screen, whatever the turtle's heading, and starts at the turtle with its baseline there. The turtle does not move. Lists are written without their brackets.</p>`,
      e: `label [Hello, turtle!] penup forward 30 pendown setlabelheight 30 label "Big`, see: ['setlabelheight', 'setlabelfont', 'labelsize'] },
    { n: 'setlabelheight', a: [], g: 'Filling and labels', s: 'SETLABELHEIGHT height',
      d: `<p>Sets how tall <code>LABEL</code> text is, in turtle steps. It starts at 14.</p>`,
      e: `for [h 10 40 10] [setlabelheight :h label :h penup forward :h + 5 pendown]`, see: ['label', 'labelsize'] },
    { n: 'labelsize', a: [], g: 'Filling and labels', s: 'LABELSIZE',
      d: `<p>Outputs the label size as a list <code>[height height]</code>.</p>`,
      e: `setlabelheight 24 show labelsize`, see: ['setlabelheight'] },
    { n: 'setlabelfont', a: [], g: 'Filling and labels', s: 'SETLABELFONT font; SETLABELFONT [font height]',
      d: `<p>Chooses the typeface for <code>LABEL</code>, by name, for example <code>"serif</code>, <code>"monospace</code> or <code>[Georgia]</code>. If you give a list with a number after the name, the number becomes the label height too. A font that the browser does not have falls back to a standard one.</p>`,
      e: `setlabelfont [serif 28] label [A serif label]`, see: ['label', 'setlabelheight'] },
    { n: 'stamp', a: [], g: 'Filling and labels', s: 'STAMP',
      d: `<p>Prints a copy of the turtle's shape onto the drawing, in the pen color, at the turtle's position and heading. The copy stays there when the turtle moves on.</p>`,
      e: `setshape "star setpencolor "orange repeat 8 [penup forward 100 stamp back 100 right 45]`, see: ['setshape'] },
    { n: 'setshape', a: [], g: 'Filling and labels', s: 'SETSHAPE shape',
      d: `<p>Changes how the turtle looks. The shape can be <code>"turtle</code>, <code>"triangle</code> (the classic Logo turtle), <code>"arrow</code>, <code>"circle</code>, <code>"square</code>, <code>"star</code> or <code>"none</code>. Shapes other than the turtle are painted in the pen color.</p>`,
      e: `setshape "arrow setpencolor "red forward 60`, see: ['shape', 'stamp', 'hideturtle'] },
    { n: 'shape', a: [], g: 'Filling and labels', s: 'SHAPE',
      d: `<p>Outputs the name of the turtle's current shape.</p>`,
      e: `setshape "circle print shape`, see: ['setshape'] },

    // ---- The screen ----------------------------------------------------------------------------
    { n: 'showturtle', a: ['st'], g: 'The screen', s: 'SHOWTURTLE',
      d: `<p>Makes the turtle visible again after <code>HIDETURTLE</code>.</p>`,
      e: `hideturtle forward 50 showturtle`, see: ['hideturtle', 'shownp'] },
    { n: 'hideturtle', a: ['ht'], g: 'The screen', s: 'HIDETURTLE',
      d: `<p>Makes the turtle invisible. It still moves and draws as before; you just see the picture without the turtle on top.</p>`,
      e: `repeat 36 [forward 100 back 100 right 10] hideturtle`, see: ['showturtle'] },
    { n: 'shownp', a: ['shown?'], g: 'The screen', s: 'SHOWNP',
      d: `<p>Outputs <code>true</code> if the turtle is visible and <code>false</code> if it is hidden.</p>`,
      e: `print shownp hideturtle print shownp showturtle`, see: ['showturtle', 'hideturtle'] },
    { n: 'clean', a: [], g: 'The screen', s: 'CLEAN',
      d: `<p>Wipes the drawing but leaves the turtle where it is, facing the same way.</p>`,
      e: `repeat 4 [forward 80 right 90] right 45 clean forward 80`, see: ['clearscreen'] },
    { n: 'clearscreen', a: ['cs'], g: 'The screen', s: 'CLEARSCREEN',
